name: Build central API bundle

on:
  push:
    branches: ["main", "release/**"]
    paths:
      - "functions/lockon-api.mjs"
      - "functions/meeting-policy.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/central-api-bundle.yml"
      - ".github/workflows/temp-neon-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockon-central-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install function build dependencies
        run: npm install --no-save --package-lock=false pg@8.16.3 google-auth-library@11.1.0 @aws-sdk/client-s3@3 @aws-sdk/s3-request-presigner@3 pdfmake@0.2.20 livekit-server-sdk@2.19.1 esbuild@0.25.12

      - name: Check source syntax
        run: node --check functions/lockon-api.mjs

      - name: Bundle for Neon Functions
        shell: bash
        run: |
          mkdir -p central-api-dist
          npx esbuild functions/lockon-api.mjs \
            --bundle \
            --platform=node \
            --target=node24 \
            --format=esm \
            --banner:js="import{createRequire as ___cr}from'module';import{fileURLToPath as ___f}from'url';import{dirname as ___d}from'path';const require=___cr(import.meta.url);const __filename=___f(import.meta.url);const __dirname=___d(__filename);" \
            --outfile=central-api-dist/index.mjs
      - name: Upload Neon function bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lockon-central-api
          path: central-api-dist/index.mjs
          if-no-files-found: error
          retention-days: 3

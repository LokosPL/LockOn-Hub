name: Verify LockOn ServiceOS

on:
  push:
    paths:
      - "src/**"
      - "electron/**"
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "electron/**"
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Validate backend syntax
        run: node --check server/index.mjs

      - name: Verify packaged backend hotfix contracts
        shell: pwsh
        run: |
          $source = Get-Content server/index.mjs -Raw
          @(
            "SUPPORT_ALREADY_ASSIGNED",
            "SELF_SUPPORT_NOT_ALLOWED",
            "CONSULTANT_NOT_REQUESTED",
            "target:'BOT'",
            "target:'CONSULTANT'",
            "value === null || value === undefined || value === ''"
          ) | ForEach-Object {
            if (-not $source.Contains($_)) {
              throw "Missing packaged backend contract: $_"
            }
          }

      - name: Verify UI action hardening contracts
        shell: pwsh
        run: |
          $customer = Get-Content src/pages/CustomerAccountsPage.tsx -Raw
          @("listRequestRef","detailRequestRef","busyRef") | ForEach-Object {
            if (-not $customer.Contains($_)) { throw "Missing customer race guard: $_" }
          }
          $service = Get-Content src/pages/ServicePage.tsx -Raw
          if (-not $service.Contains("searchRequestRef")) { throw "Missing service search race guard." }
          $browser = Get-Content src/pages/BrowserPage.tsx -Raw
          @("actionBusy","browser-action-error") | ForEach-Object {
            if (-not $browser.Contains($_)) { throw "Missing browser action guard: $_" }
          }
          $settings = Get-Content src/pages/SettingsPage.tsx -Raw
          @("scaleBusy","settings-action-error") | ForEach-Object {
            if (-not $settings.Contains($_)) { throw "Missing settings action guard: $_" }
          }

      - name: Verify service finance UI contracts
        shell: pwsh
        run: |
          $service = Get-Content src/pages/ServicePage.tsx -Raw
          @("TechnicianCalendar","InvoiceWarehouse","TechnicianNotesRoom","OrderCostingCard") | ForEach-Object {
            if (-not $service.Contains($_)) { throw "Missing v0.21 service workspace contract: $_" }
          }
          $costing = Get-Content src/components/OrderCostingCard.tsx -Raw
          @("Mam FV zakupu","Kwota za robociznę","Dodaj FV w PDF","Marża informacyjna") | ForEach-Object {
            if (-not $costing.Contains($_)) { throw "Missing costing UI contract: $_" }
          }
          $electron = Get-Content electron/main.ts -Raw
          @("assertPdfFile","sha256File","%PDF-","service:downloadInvoiceBatch") | ForEach-Object {
            if (-not $electron.Contains($_)) { throw "Missing secure invoice IPC contract: $_" }
          }

      - name: Typecheck renderer
        run: npm run typecheck

      - name: Compile Electron
        run: npm run build:electron

      - name: Build renderer
        run: npm run build:web

      - name: Build self-contained packaged API
        run: npm run build:server

      - name: Package smoke build
        run: npx electron-builder --win --dir

      - name: Smoke test packaged local API
        shell: pwsh
        run: |
          $exe = Resolve-Path "release/win-unpacked/LockOn ServiceOS.exe"
          $server = Resolve-Path "release/win-unpacked/resources/app.asar.unpacked/dist-server/index.cjs"
          $data = Join-Path $env:RUNNER_TEMP "lockon-smoke-database.json"
          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:LOCKON_API_HOST = "127.0.0.1"
          $env:LOCKON_API_PORT = "18787"
          $env:LOCKON_DATA_FILE = $data
          $env:LOCKON_OWNER_EMAIL = "nowogar@gmail.com"
          $env:LOCKON_GOOGLE_CLIENT_ID = "996585439932-e10mu53j95s6u13vrua841tm4oco38so.apps.googleusercontent.com"

          $process = Start-Process -FilePath $exe -ArgumentList @($server) -WorkingDirectory $env:RUNNER_TEMP -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 350
              if ($process.HasExited) {
                throw "Pakietowany backend zakończył się przed uruchomieniem."
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18787/health" -TimeoutSec 2
                if ($health.ok -eq $true) {
                  $ok = $true
                  break
                }
              } catch {}
            }
            if (-not $ok) {
              throw "Pakietowany backend nie odpowiedział na /health."
            }
          } finally {
            if (-not $process.HasExited) { $process.Kill() }
          }

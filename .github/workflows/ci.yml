name: Verify LockOn ServiceOS

on:
  push:
    branches: ["main", "release/**"]
    paths:
      - "src/**"
      - "electron/**"
      - "build/**"
      - "server/**"
      - "functions/**"
      - "tests/**"
      - "database/migrations/**"
      - "RELEASE_VERSION"
      - "BUILD_VERSION"
      - "RELEASE_READY"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/ci.yml"
      - ".github/workflows/neon-api-verify.yml"
      - ".github/workflows/central-api-bundle.yml"
      - ".github/workflows/temp-neon-smoke.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/prod-smoke.yml"
      - ".github/workflows/prod-neon-deploy.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "electron/**"
      - "server/**"
      - "functions/**"
      - "tests/**"
      - "database/migrations/**"
      - "RELEASE_VERSION"
      - "BUILD_VERSION"
      - "RELEASE_READY"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/ci.yml"
      - ".github/workflows/neon-api-verify.yml"
      - ".github/workflows/central-api-bundle.yml"
      - ".github/workflows/temp-neon-smoke.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/prod-smoke.yml"
      - ".github/workflows/prod-neon-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockon-ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Verify product and build version contracts
        shell: pwsh
        run: |
          $product = (Get-Content RELEASE_VERSION -Raw).Trim()
          $build = (Get-Content BUILD_VERSION -Raw).Trim()
          $package = node -p "require('./package.json').version"
          if ($product -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "RELEASE_VERSION must be four-part." }
          if ($build -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "BUILD_VERSION must be SemVer." }
          if ($package -ne $build) { throw "package.json version ($package) must match BUILD_VERSION ($build)." }
          $config = Get-Content electron/appConfig.ts -Raw
          if (-not $config.Contains("productVersion: '$product'")) { throw "Desktop productVersion must match RELEASE_VERSION." }

      - name: Verify ServiceOS app icon contract
        shell: pwsh
        run: |
          $uiIcon = Get-Content src/assets/logo.svg -Raw
          $buildIcon = Get-Content build/icon.svg -Raw
          foreach ($icon in @($uiIcon, $buildIcon)) {
            if (-not $icon.Contains('smartfon otoczony pomarańczową orbitą')) { throw 'Missing ServiceOS phone-orbit icon.' }
            if (-not $icon.Contains('id="orbit"')) { throw 'Missing orange orbit gradient.' }
          }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.build.win.icon -ne 'build/icon.svg') { throw 'Windows app icon must point to build/icon.svg.' }

      - name: Validate backend syntax
        run: node --check server/index.mjs

      - name: Verify packaged backend hotfix contracts
        shell: pwsh
        run: |
          $source = Get-Content server/index.mjs -Raw
          @(
            "SUPPORT_ALREADY_ASSIGNED",
            "SELF_SUPPORT_NOT_ALLOWED",
            "CONSULTANT_NOT_REQUESTED",
            "target:'BOT'",
            "target:'CONSULTANT'",
            "value === null || value === undefined || value === ''"
          ) | ForEach-Object {
            if (-not $source.Contains($_)) {
              throw "Missing packaged backend contract: $_"
            }
          }

      - name: Verify UI action hardening contracts
        shell: pwsh
        run: |
          $customer = Get-Content src/pages/CustomerAccountsPage.tsx -Raw
          @("listRequestRef","detailRequestRef","busyRef") | ForEach-Object {
            if (-not $customer.Contains($_)) { throw "Missing customer race guard: $_" }
          }
          $service = Get-Content src/pages/ServicePage.tsx -Raw
          if (-not $service.Contains("searchRequestRef")) { throw "Missing service search race guard." }
          $pickupCtaCount = ([regex]::Matches($service, 'Wydaj telefon klientowi')).Count
          if ($pickupCtaCount -ne 1) { throw "Pickup CTA must appear exactly once in ServicePage, found $pickupCtaCount." }
          @(
            "isActualTechnician ? 'CALENDAR' : 'ORDERS'",
            "service-stage-actions",
            "canShowWarranty",
            "canManageWarrantyHere",
            "canTransferService = canCreateService",
            "canCompletePickupHere = effectiveRole === 'USER'"
          ) | ForEach-Object {
            if (-not $service.Contains($_)) { throw "Missing service hotfix UX contract: $_" }
          }
          $styles = Get-Content src/styles.css -Raw
          if (-not $styles.Contains(".service-order-workspace-frontdesk .service-workspace-collapse.service-transfer-card")) {
            throw "USER front-desk must keep logistics controls visible."
          }
          $central = Get-Content functions/lockon-api.mjs -Raw
          @("WARRANTY_ACTIVE_POINT_REQUIRED","WARRANTY_WRONG_ACTIVE_POINT","WARRANTY_DEVICE_IN_TRANSFER") | ForEach-Object {
            if (-not $central.Contains($_)) { throw "Missing warranty physical-location contract: $_" }
          }

      - name: Verify service finance UI contracts
        shell: pwsh
        run: |
          $service = Get-Content src/pages/ServicePage.tsx -Raw
          @("TechnicianCalendar","InvoiceWarehouse","TechnicianNotesRoom","OrderCostingCard") | ForEach-Object {
            if (-not $service.Contains($_)) { throw "Missing v0.21 service workspace contract: $_" }
          }
          $costing = Get-Content src/components/OrderCostingCard.tsx -Raw
          @("Mam fakturę zakupu","Robocizna — koszt wewnętrzny","Dodaj FV w PDF","Zostaje po kosztach","Brakuje do pokrycia kosztów") | ForEach-Object {
            if (-not $costing.Contains($_)) { throw "Missing costing UI contract: $_" }
          }

      - name: Typecheck renderer
        run: npm run typecheck

      - name: Build renderer
        run: npm run build:web

      - name: Compile Electron
        run: npm run build:electron

      - name: Check central backend
        run: |
          node --check functions/meeting-policy.mjs
          node --check functions/lockon-api.mjs

      - name: Build self-contained packaged API
        run: npm run build:server

      - name: Run regression tests
        run: npm test

      - name: Package smoke build
        run: npx electron-builder --win --dir

      - name: Smoke test technician workspace and costing
        shell: pwsh
        run: |
          $exe = Resolve-Path "release/win-unpacked/LockOn ServiceOS.exe"
          $server = Resolve-Path "release/win-unpacked/resources/app.asar.unpacked/dist-server/index.cjs"
          $data = Join-Path $env:RUNNER_TEMP "lockon-v021-technician-smoke.json"
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $tokenA = "token_a"
          $tokenB = "token_b"
          $tokenHashA = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($tokenA))).ToLowerInvariant()
          $tokenHashB = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($tokenB))).ToLowerInvariant()
          $db = @{
            version = 2
            users = @(
              @{ id="usr_a1111111111111111111"; email="tech1@example.invalid"; name="Technik Jeden"; role="TECHNICIAN"; technicianSplitPercent=50; supportEnabled=$false; status="ACTIVE"; pointIds=@("pnt_v021"); firstLoginAt=(Get-Date).ToUniversalTime().ToString("o"); lastLoginAt=(Get-Date).ToUniversalTime().ToString("o") },
              @{ id="usr_b2222222222222222222"; email="tech2@example.invalid"; name="Technik Dwa"; role="TECHNICIAN"; technicianSplitPercent=50; supportEnabled=$false; status="ACTIVE"; pointIds=@("pnt_v021"); firstLoginAt=(Get-Date).ToUniversalTime().ToString("o"); lastLoginAt=(Get-Date).ToUniversalTime().ToString("o") }
            )
            points = @(@{ id="pnt_v021"; name="Serwis V021"; city="Nowogard"; active=$true; createdAt=(Get-Date).ToUniversalTime().ToString("o") })
            customers = @(@{ id="cst_c3333333333333333333"; firstName="Test"; lastName="Klient"; email="client@example.invalid"; phone=""; createdAt=(Get-Date).ToUniversalTime().ToString("o"); updatedAt=(Get-Date).ToUniversalTime().ToString("o") })
            devices = @(@{ id="dev_c3333333333333333333"; customerId="cst_c3333333333333333333"; brand="Samsung"; model="S25"; imei=$null; serialNumber=$null; notes=""; createdAt=(Get-Date).ToUniversalTime().ToString("o"); updatedAt=(Get-Date).ToUniversalTime().ToString("o") })
            serviceOrders = @(@{ id="srv_d4444444444444444444"; orderNumber=1; pointId="pnt_v021"; homePointId="pnt_v021"; currentPointId="pnt_v021"; customerId="cst_c3333333333333333333"; deviceId="dev_c3333333333333333333"; orderType="REPAIR"; handlingMode="STANDARD"; issueDescription="Smoke v0.21"; status="WAITING_PARTS"; assignedTechnicianId="usr_a1111111111111111111"; createdByUserId="usr_a1111111111111111111"; estimatedCost=900; finalCost=1100; currency="PLN"; estimatedCompletionAt=(Get-Date).AddDays(1).ToUniversalTime().ToString("o"); receivedAt=(Get-Date).ToUniversalTime().ToString("o"); createdAt=(Get-Date).ToUniversalTime().ToString("o"); updatedAt=(Get-Date).ToUniversalTime().ToString("o") })
            sessions = @(
              @{ tokenHash=$tokenHashA; userId="usr_a1111111111111111111"; createdAt=$now; lastSeenAt=$now; expiresAt=($now+7200000); absoluteExpiresAt=($now+10800000) },
              @{ tokenHash=$tokenHashB; userId="usr_b2222222222222222222"; createdAt=$now; lastSeenAt=$now; expiresAt=($now+7200000); absoluteExpiresAt=($now+10800000) }
            )
          }
          $db | ConvertTo-Json -Depth 20 | Set-Content -Encoding UTF8 $data

          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:LOCKON_API_HOST = "127.0.0.1"
          $env:LOCKON_API_PORT = "18788"
          $env:LOCKON_DATA_FILE = $data
          $env:LOCKON_OWNER_EMAIL = "owner-v021@example.invalid"
          $process = Start-Process -FilePath $exe -ArgumentList @($server) -WorkingDirectory $env:RUNNER_TEMP -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 300
              try { $health = Invoke-RestMethod -Uri "http://127.0.0.1:18788/health"; if ($health.ok) { $ready=$true; break } } catch {}
            }
            if (-not $ready) { throw "Packaged API did not start." }

            $headersA = @{ Authorization="Bearer $tokenA" }
            $headersB = @{ Authorization="Bearer $tokenB" }
            $workspace = Invoke-RestMethod -Uri "http://127.0.0.1:18788/service/technician-workspace" -Headers $headersA
            if ($workspace.counts.waitingParts -ne 1) { throw "Technician workspace missing waiting-parts order." }

            $costingBody = @{ laborCostGross=120; otherCostGross=30; parts=@(@{ description="Ekran"; quantity=1; unitCostGross=400; invoiceReceived=$true; invoiceNumber="FV/1"; supplier="Parts"; purchasedAt="2025-01-10" }) } | ConvertTo-Json -Depth 6
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18788/service/orders/srv_d4444444444444444444/costing" -Headers $headersA -ContentType "application/json" -Body $costingBody | Out-Null
            $costing = Invoke-RestMethod -Uri "http://127.0.0.1:18788/service/orders/srv_d4444444444444444444/costing" -Headers $headersA
            if ($costing.internalCostGross -ne 550) { throw "Costing total mismatch." }
            if ($costing.marginGross -ne 550) { throw "Costing margin mismatch." }

            $noteBody = @{ title="Prywatna"; body="Tylko moje"; pinned=$true } | ConvertTo-Json
            $createdNote = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18788/service/technician-notes" -Headers $headersA -ContentType "application/json" -Body $noteBody
            $notesA = Invoke-RestMethod -Uri "http://127.0.0.1:18788/service/technician-notes" -Headers $headersA
            $notesB = Invoke-RestMethod -Uri "http://127.0.0.1:18788/service/technician-notes" -Headers $headersB
            if ($notesA.Count -ne 1 -or $notesB.Count -ne 0) { throw "Technician notes privacy regression." }
            Invoke-RestMethod -Method Delete -Uri ("http://127.0.0.1:18788/service/technician-notes/"+$createdNote.id) -Headers $headersA | Out-Null
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Smoke test packaged local API
        shell: pwsh
        run: |
          $exe = Resolve-Path "release/win-unpacked/LockOn ServiceOS.exe"
          $server = Resolve-Path "release/win-unpacked/resources/app.asar.unpacked/dist-server/index.cjs"
          $data = Join-Path $env:RUNNER_TEMP "lockon-smoke.json"
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $token = "smoke_token"
          $tokenHash = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($token))).ToLowerInvariant()
          $db = @{
            version = 2
            users = @(
              @{ id="usr_aaaaaaaaaaaaaaaaaaaa"; email="smoke@example.invalid"; name="Smoke User"; role="USER"; technicianSplitPercent=$null; supportEnabled=$false; status="ACTIVE"; pointIds=@("pnt_smoke"); firstLoginAt=(Get-Date).ToUniversalTime().ToString("o"); lastLoginAt=(Get-Date).ToUniversalTime().ToString("o") }
            )
            points = @(@{ id="pnt_smoke"; name="Smoke Point"; city="Warszawa"; active=$true; createdAt=(Get-Date).ToUniversalTime().ToString("o") })
            customers = @()
            devices = @()
            serviceOrders = @()
            sessions = @(@{ tokenHash=$tokenHash; userId="usr_aaaaaaaaaaaaaaaaaaaa"; createdAt=$now; lastSeenAt=$now; expiresAt=($now+7200000); absoluteExpiresAt=($now+10800000) })
          }
          $db | ConvertTo-Json -Depth 20 | Set-Content -Encoding UTF8 $data

          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:LOCKON_API_HOST = "127.0.0.1"
          $env:LOCKON_API_PORT = "18787"
          $env:LOCKON_DATA_FILE = $data
          $env:LOCKON_OWNER_EMAIL = "owner-smoke@example.invalid"
          $process = Start-Process -FilePath $exe -ArgumentList @($server) -WorkingDirectory $env:RUNNER_TEMP -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 300
              try { $health = Invoke-RestMethod -Uri "http://127.0.0.1:18787/health"; if ($health.ok) { $ready=$true; break } } catch {}
            }
            if (-not $ready) { throw "Packaged API did not start." }
            $headers = @{ Authorization="Bearer $token" }
            $state = Invoke-RestMethod -Uri "http://127.0.0.1:18787/me" -Headers $headers
            if ($state.user.email -ne "smoke@example.invalid") { throw "Packaged API auth smoke failed." }
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

name: Verify LockOn ServiceOS

on:
  push:
    paths:
      - "src/**"
      - "electron/**"
      - "server/**"
      - "functions/**"
      - "database/migrations/**"
      - "RELEASE_VERSION"
      - "BUILD_VERSION"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/ci.yml"
      - ".github/workflows/neon-api-verify.yml"
      - ".github/workflows/central-api-bundle.yml"
      - ".github/workflows/temp-neon-smoke.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/prod-smoke.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "electron/**"
      - "server/**"
      - "functions/**"
      - "database/migrations/**"
      - "RELEASE_VERSION"
      - "BUILD_VERSION"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/ci.yml"
      - ".github/workflows/neon-api-verify.yml"
      - ".github/workflows/central-api-bundle.yml"
      - ".github/workflows/temp-neon-smoke.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/prod-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Verify product and build version contracts
        shell: pwsh
        run: |
          $product = (Get-Content RELEASE_VERSION -Raw).Trim()
          $build = (Get-Content BUILD_VERSION -Raw).Trim()
          $package = node -p "require('./package.json').version"
          if ($product -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "RELEASE_VERSION must be four-part." }
          if ($build -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "BUILD_VERSION must be SemVer." }
          if ($package -ne $build) { throw "package.json version ($package) must match BUILD_VERSION ($build)." }
          $config = Get-Content electron/appConfig.ts -Raw
          if (-not $config.Contains("productVersion: '$product'")) { throw "Desktop productVersion must match RELEASE_VERSION." }

      - name: Validate backend syntax
        run: node --check server/index.mjs

      - name: Verify packaged backend hotfix contracts
        shell: pwsh
        run: |
          $source = Get-Content server/index.mjs -Raw
          @(
            "SUPPORT_ALREADY_ASSIGNED",
            "SELF_SUPPORT_NOT_ALLOWED",
            "CONSULTANT_NOT_REQUESTED",
            "target:'BOT'",
            "target:'CONSULTANT'",
            "value === null || value === undefined || value === ''"
          ) | ForEach-Object {
            if (-not $source.Contains($_)) {
              throw "Missing packaged backend contract: $_"
            }
          }

      - name: Verify UI action hardening contracts
        shell: pwsh
        run: |
          $customer = Get-Content src/pages/CustomerAccountsPage.tsx -Raw
          @("listRequestRef","detailRequestRef","busyRef") | ForEach-Object {
            if (-not $customer.Contains($_)) { throw "Missing customer race guard: $_" }
          }
          $service = Get-Content src/pages/ServicePage.tsx -Raw
          if (-not $service.Contains("searchRequestRef")) { throw "Missing service search race guard." }
          $pickupCtaCount = ([regex]::Matches($service, 'Wydaj telefon klientowi')).Count
          if ($pickupCtaCount -ne 1) { throw "Pickup CTA must appear exactly once in ServicePage, found $pickupCtaCount." }
          @(
            "isActualTechnician ? 'CALENDAR' : 'ORDERS'",
            "service-stage-actions",
            "canShowWarranty",
            "canManageWarrantyHere"
          ) | ForEach-Object {
            if (-not $service.Contains($_)) { throw "Missing service hotfix UX contract: $_" }
          }
          $central = Get-Content functions/lockon-api.mjs -Raw
          @("WARRANTY_ACTIVE_POINT_REQUIRED","WARRANTY_WRONG_ACTIVE_POINT","WARRANTY_DEVICE_IN_TRANSFER") | ForEach-Object {
            if (-not $central.Contains($_)) { throw "Missing warranty physical-location contract: $_" }
          }
          $browser = Get-Content src/pages/BrowserPage.tsx -Raw
          @("actionBusy","browser-action-error") | ForEach-Object {
            if (-not $browser.Contains($_)) { throw "Missing browser action guard: $_" }
          }
          $settings = Get-Content src/pages/SettingsPage.tsx -Raw
          @("scaleBusy","settings-action-error") | ForEach-Object {
            if (-not $settings.Contains($_)) { throw "Missing settings action guard: $_" }
          }

      - name: Verify Google OAuth reliability contracts
        shell: pwsh
        run: |
          $auth = Get-Content electron/googleAuth.ts -Raw
          @(
            "GOOGLE_OAUTH_USER_WAIT_MS = 10 * 60_000",
            "GOOGLE_OAUTH_EXCHANGE_TIMEOUT_MS = 45_000",
            "clearUserWaitTimer();",
            "callbackAccepted = true",
            "AbortSignal.timeout(GOOGLE_OAUTH_EXCHANGE_TIMEOUT_MS)",
            "googleLoginInFlight"
          ) | ForEach-Object {
            if (-not $auth.Contains($_)) { throw "Missing Google OAuth reliability contract: $_" }
          }
          if ($auth.Contains("}, 180_000);")) {
            throw "Legacy 180-second whole-flow OAuth timeout must not return."
          }

          $api = Get-Content electron/backendApi.ts -Raw
          @("name === 'AbortError'","name === 'TimeoutError'","signal?: AbortSignal") | ForEach-Object {
            if (-not $api.Contains($_)) { throw "Missing auth API timeout contract: $_" }
          }

          $central = Get-Content functions/lockon-api.mjs -Raw
          @("AbortSignal.timeout(15_000)","GOOGLE_UPSTREAM_TIMEOUT","status: 504") | ForEach-Object {
            if (-not $central.Contains($_)) { throw "Missing central Google OAuth timeout contract: $_" }
          }

          $login = Get-Content src/pages/LoginScreen.tsx -Raw
          if (-not $login.Contains("ServiceOS poczeka na Ciebie")) {
            throw "Login screen must explain that the app keeps waiting for browser completion."
          }

      - name: Verify Start and browser polish contracts
        shell: pwsh
        run: |
          $dashboard = Get-Content src/pages/Dashboard.tsx -Raw
          @("start-clock","start-weather-card","data.getWeather","weatherCity") | ForEach-Object {
            if (-not $dashboard.Contains($_)) { throw "Missing Start dashboard contract: $_" }
          }
          if ($dashboard.Contains("Pulpit wykorzystuje całe dostępne miejsce")) {
            throw "Technical dashboard copy must not be visible to users."
          }

          $app = Get-Content src/App.tsx -Raw
          @("auth.requestedPoint?.city","auth.point?.city","weatherCity={weatherCity}") | ForEach-Object {
            if (-not $app.Contains($_)) { throw "Missing account-city weather contract: $_" }
          }

          $preload = Get-Content electron/preload.ts -Raw
          if (-not $preload.Contains("data:getWeather")) { throw "Weather IPC is not exposed." }

          $electron = Get-Content electron/main.ts -Raw
          @("fetchStartWeather","geocoding-api.open-meteo.com","api.open-meteo.com/v1/forecast","AbortSignal.timeout(8_000)") | ForEach-Object {
            if (-not $electron.Contains($_)) { throw "Missing weather safety contract: $_" }
          }

          $browser = Get-Content electron/browser.ts -Raw
          @("setBorderRadius(14)","setBorderRadius(Math.max(10","setBackgroundColor('#0b0f14')") | ForEach-Object {
            if (-not $browser.Contains($_)) { throw "Missing embedded browser clipping contract: $_" }
          }

      - name: Verify unified Google and Gmail OAuth contracts
        shell: pwsh
        run: |
          $login = Get-Content src/pages/LoginScreen.tsx -Raw
          if ($login.Contains("window.lockOn.gmail.connect")) {
            throw "Login screen must not start a second Gmail OAuth flow."
          }
          @("Zalogowano. Otwieram ServiceOS","Jedno logowanie obejmuje wysyłkę Gmail","gmail.send") | ForEach-Object {
            if (-not $login.Contains($_)) { throw "Missing unified login UX contract: $_" }
          }

          $auth = Get-Content electron/googleAuth.ts -Raw
          @(
            "https://www.googleapis.com/auth/gmail.send",
            "access_type: 'offline'",
            "include_granted_scopes: 'true'",
            "prompt: 'consent select_account'"
          ) | ForEach-Object {
            if (-not $auth.Contains($_)) { throw "Missing primary OAuth Gmail contract: $_" }
          }

          $central = Get-Content functions/lockon-api.mjs -Raw
          @(
            "autoConnectGmailFromPrimaryLogin",
            "GMAIL_CONNECTED_AT_LOGIN",
            "PRIMARY_GOOGLE_OAUTH",
            "OWNER_PRIVACY",
            "GMAIL_SCOPE_NOT_GRANTED",
            "REFRESH_TOKEN_MISSING",
            "GMAIL_REUSED_AT_LOGIN",
            "EXISTING_SERVER_REFRESH_TOKEN",
            "EXISTING_SENDER_REUSED"
          ) | ForEach-Object {
            if (-not $central.Contains($_)) { throw "Missing central unified Gmail contract: $_" }
          }

          $gmail = Get-Content electron/gmailAuth.ts -Raw
          @(
            "GMAIL_OAUTH_USER_WAIT_MS = 10 * 60_000",
            "GMAIL_OAUTH_EXCHANGE_TIMEOUT_MS = 60_000",
            "callbackAccepted = true",
            "clearUserWaitTimer()",
            "AbortSignal.timeout(GMAIL_OAUTH_EXCHANGE_TIMEOUT_MS)",
            "gmailConnectInFlight"
          ) | ForEach-Object {
            if (-not $gmail.Contains($_)) { throw "Missing manual Gmail recovery contract: $_" }
          }

      - name: Verify service finance UI contracts
        shell: pwsh
        run: |
          $service = Get-Content src/pages/ServicePage.tsx -Raw
          @("TechnicianCalendar","InvoiceWarehouse","TechnicianNotesRoom","OrderCostingCard") | ForEach-Object {
            if (-not $service.Contains($_)) { throw "Missing v0.21 service workspace contract: $_" }
          }
          $costing = Get-Content src/components/OrderCostingCard.tsx -Raw
          @("Mam FV zakupu","Kwota za robociznę","Dodaj FV w PDF","Marża informacyjna") | ForEach-Object {
            if (-not $costing.Contains($_)) { throw "Missing costing UI contract: $_" }
          }
          $electron = Get-Content electron/main.ts -Raw
          @("assertPdfFile","sha256File","%PDF-","service:downloadInvoiceBatch") | ForEach-Object {
            if (-not $electron.Contains($_)) { throw "Missing secure invoice IPC contract: $_" }
          }

          $api = Get-Content functions/lockon-api.mjs -Raw
          @("COALESCE(s.current_point_id,s.home_point_id,s.point_id)","t.status IN ('REQUESTED','IN_TRANSIT','DELIVERED')","FOR UPDATE") | ForEach-Object {
            if (-not $api.Contains($_)) { throw "Missing v1 service safety regression contract: $_" }
          }

          $brands = Get-Content src/config/phoneBrands.ts -Raw
          @("'Apple'","'Samsung'","'Xiaomi'","'Huawei'","'Motorola'","'Nokia'","'Nothing'","'OnePlus'") | ForEach-Object {
            if (-not $brands.Contains($_)) { throw "Missing phone brand suggestion: $_" }
          }

          @("service-brand-suggestions","service-order-type-picker","service-estimate-field","service-intake-eta","service-quick-pills","canSetIntakeEstimate","canSetIntakeEta",'type="date"',"Nie podano","Brak uwag","Marka <em>opcjonalnie</em>","Model <em>opcjonalnie</em>","IMEI <em>opcjonalnie</em>","Numer seryjny <em>opcjonalnie</em>") | ForEach-Object {
            if (-not $service.Contains($_)) { throw "Missing simplified intake UI contract: $_" }
          }
          @("<span>Punkt przyjęcia</span>","<span>Sposób obsługi</span>","form.assignedTechnicianId") | ForEach-Object {
            if ($service.Contains($_)) { throw "Legacy intake control returned: $_" }
          }

          @(
            "TECHNICIAN_AT_INTAKE",
            "!firstName||!lastName||!issue",
            "IMEI powinien zawierać 14–16 cyfr.",
            "serviceCardNumber='KS-'",
            "customerPortalBaseUrl:PUBLIC_PORTAL_URL+'/klient.html'",
            "Cena orientacyjna",
            "Warunki przyjęcia i odbioru",
            "Nieodebranie urządzenia nie oznacza porzucenia ani przeniesienia własności na sklep",
            "szkody będące następstwem utraty",
            "Zeskanuj kod QR w ServiceOS, aby otworzyć zlecenie i obsłużyć urządzenie.",
            "Kod ręczny — użyj, gdy nie możesz zeskanować QR.",
            "customerServiceCardPortraitContent",
            "if(normalized==='CUSTOMER')",
            "pageSize:'A4',pageOrientation:'portrait',pageMargins:[30,24,30,24]",
            "labelFontSize:10,valueFontSize:11,rowMargin:3",
            "serviceCardTermsBlock({titleFontSize:11.5,fontSize:8.8,marginTop:10})",
            "fontSize:18,bold:true,color:'#000000',characterSpacing:1",
            "formatServiceCardDateTime(context.receivedAt)",
            "Przyjęcie i urządzenie",
            "Obsługa serwisowa",
            "renderServiceCardPdf(item.service_order_id,'CUSTOMER')",
            "OWNER_OPERATIONAL_NAME = 'System LockOn'",
            "OWNER_SUPPORT_NAME = 'Właściciel aplikacji'",
            "canSetIntakeEstimate=SERVICE_CREATE_ROLES.has(u.role_code)",
            "canSetIntakeEta=SERVICE_CREATE_ROLES.has(u.role_code)",
            "brandInput||'Nie podano'",
            "deviceNotes=cleanText(body.deviceNotes,1000)||'Brak uwag'"
          ) | ForEach-Object {
            if (-not $api.Contains($_)) { throw "Missing intake/card regression contract: $_" }
          }
          $createOrderValidation = "!firstName||!lastName||!issue"
          if (-not $api.Contains($createOrderValidation)) {
            throw "Create-order validation must keep only customer identity and issue description mandatory."
          }

      - name: Typecheck renderer
        run: npm run typecheck

      - name: Compile Electron
        run: npm run build:electron

      - name: Build renderer
        run: npm run build:web

      - name: Build self-contained packaged API
        run: npm run build:server

      - name: Package smoke build
        run: npx electron-builder --win --dir

      - name: Smoke test technician workspace and costing
        shell: pwsh
        run: |
          $exe = Resolve-Path "release/win-unpacked/LockOn ServiceOS.exe"
          $server = Resolve-Path "release/win-unpacked/resources/app.asar.unpacked/dist-server/index.cjs"
          $data = Join-Path $env:RUNNER_TEMP "lockon-v021-technician-smoke.json"
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $db = @{
            version = 2
            users = @(
              @{ id="usr_a1111111111111111111"; email="tech1@example.invalid"; name="Technik Jeden"; role="TECHNICIAN"; technicianSplitPercent=50; supportEnabled=$false; status="ACTIVE"; pointIds=@("pnt_v021"); firstLoginAt=(Get-Date).ToUniversalTime().ToString("o"); lastLoginAt=(Get-Date).ToUniversalTime().ToString("o") },
              @{ id="usr_b2222222222222222222"; email="tech2@example.invalid"; name="Technik Dwa"; role="TECHNICIAN"; technicianSplitPercent=50; supportEnabled=$false; status="ACTIVE"; pointIds=@("pnt_v021"); firstLoginAt=(Get-Date).ToUniversalTime().ToString("o"); lastLoginAt=(Get-Date).ToUniversalTime().ToString("o") }
            )
            points = @(@{ id="pnt_v021"; name="Serwis V021"; city="Nowogard"; active=$true; createdAt=(Get-Date).ToUniversalTime().ToString("o") })
            customers = @(@{ id="cst_c3333333333333333333"; firstName="Test"; lastName="Klient"; email="client@example.invalid"; phone=""; createdAt=(Get-Date).ToUniversalTime().ToString("o"); updatedAt=(Get-Date).ToUniversalTime().ToString("o") })
            devices = @(@{ id="dev_c3333333333333333333"; customerId="cst_c3333333333333333333"; brand="Samsung"; model="S25"; imei=$null; serialNumber=$null; notes=""; createdAt=(Get-Date).ToUniversalTime().ToString("o"); updatedAt=(Get-Date).ToUniversalTime().ToString("o") })
            serviceOrders = @(@{ id="srv_d4444444444444444444"; orderNumber=1; pointId="pnt_v021"; homePointId="pnt_v021"; currentPointId="pnt_v021"; customerId="cst_c3333333333333333333"; deviceId="dev_c3333333333333333333"; orderType="REPAIR"; handlingMode="STANDARD"; issueDescription="Smoke v0.21"; status="WAITING_PARTS"; assignedTechnicianId="usr_a1111111111111111111"; createdByUserId="usr_a1111111111111111111"; estimatedCost=900; finalCost=1100; currency="PLN"; estimatedCompletionAt=(Get-Date).AddDays(1).ToUniversalTime().ToString("o"); receivedAt=(Get-Date).ToUniversalTime().ToString("o"); createdAt=(Get-Date).ToUniversalTime().ToString("o"); updatedAt=(Get-Date).ToUniversalTime().ToString("o") })
            sessions = @(
              @{ tokenHash="451f81b905e43401b600af1d1a26f5cdcbc870d71dc4c7441cfa5fc94e251e18"; userId="usr_a1111111111111111111"; createdAt=$now; lastSeenAt=$now; expiresAt=($now+7200000); absoluteExpiresAt=($now+10800000) },
              @{ tokenHash="2027835918c417f9104e9a74dc502411f77cf3755787bf9e96adec6bf4160424"; userId="usr_b2222222222222222222"; createdAt=$now; lastSeenAt=$now; expiresAt=($now+7200000); absoluteExpiresAt=($now+10800000) }
            )
          }
          $db | ConvertTo-Json -Depth 20 | Set-Content -Encoding UTF8 $data

          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:LOCKON_API_HOST = "127.0.0.1"
          $env:LOCKON_API_PORT = "18788"
          $env:LOCKON_DATA_FILE = $data
          $env:LOCKON_OWNER_EMAIL = "owner-v021@example.invalid"
          $process = Start-Process -FilePath $exe -ArgumentList @($server) -WorkingDirectory $env:RUNNER_TEMP -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 300
              try {
                if ((Invoke-RestMethod -Uri "http://127.0.0.1:18788/health" -TimeoutSec 2).ok) { $ready=$true; break }
              } catch {}
            }
            if (-not $ready) { throw "v0.21 local API did not start." }

            $h1 = @{ Authorization="Bearer v021-local-tech-one"; "Content-Type"="application/json" }
            $h2 = @{ Authorization="Bearer v021-local-tech-two"; "Content-Type"="application/json" }
            $workspace = Invoke-RestMethod -Uri "http://127.0.0.1:18788/service/technician-workspace" -Headers $h1
            if ($workspace.counts.active -ne 1 -or $workspace.counts.waitingParts -ne 1) { throw "Technician workspace counts are wrong." }

            $costBody = @{ laborCostGross=250; otherCostGross=30; parts=@(@{ description="Ekran"; quantity=2; unitCostGross=120.5; invoiceReceived=$true; invoiceNumber="FV-TEST"; supplier="Supplier"; purchasedAt="2026-09-20" }) } | ConvertTo-Json -Depth 8
            $costing = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18788/service/orders/srv_d4444444444444444444/costing" -Headers $h1 -Body $costBody
            if ($costing.partsCostGross -ne 241 -or $costing.internalCostGross -ne 521 -or $costing.marginGross -ne 579) { throw "Technician costing math is wrong." }

            $noteBody = @{ title="Prywatne"; body="Zamówić część jutro"; pinned=$true } | ConvertTo-Json
            $note = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18788/service/technician-notes" -Headers $h1 -Body $noteBody
            if ($note.body -ne "Zamówić część jutro") { throw "Private technician note was not saved." }

            $foreign = Invoke-WebRequest -SkipHttpErrorCheck -Method Post -Uri "http://127.0.0.1:18788/service/orders/srv_d4444444444444444444/costing" -Headers $h2 -Body $costBody
            if ($foreign.StatusCode -ne 403) { throw "Second technician must not edit another technician's costing." }
          } finally {
            if (-not $process.HasExited) { $process.Kill() }
          }

      - name: Smoke test packaged local API
        shell: pwsh
        run: |
          $exe = Resolve-Path "release/win-unpacked/LockOn ServiceOS.exe"
          $server = Resolve-Path "release/win-unpacked/resources/app.asar.unpacked/dist-server/index.cjs"
          $data = Join-Path $env:RUNNER_TEMP "lockon-smoke-database.json"
          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:LOCKON_API_HOST = "127.0.0.1"
          $env:LOCKON_API_PORT = "18787"
          $env:LOCKON_DATA_FILE = $data
          $env:LOCKON_OWNER_EMAIL = "nowogar@gmail.com"
          $env:LOCKON_GOOGLE_CLIENT_ID = "996585439932-e10mu53j95s6u13vrua841tm4oco38so.apps.googleusercontent.com"

          $process = Start-Process -FilePath $exe -ArgumentList @($server) -WorkingDirectory $env:RUNNER_TEMP -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 350
              if ($process.HasExited) {
                throw "Pakietowany backend zakończył się przed uruchomieniem."
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18787/health" -TimeoutSec 2
                if ($health.ok -eq $true) {
                  $ok = $true
                  break
                }
              } catch {}
            }
            if (-not $ok) {
              throw "Pakietowany backend nie odpowiedział na /health."
            }
          } finally {
            if (-not $process.HasExited) { $process.Kill() }
          }

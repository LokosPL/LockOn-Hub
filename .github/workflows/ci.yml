name: Verify LockOn ServiceOS

on:
  push:
    paths:
      - "src/**"
      - "electron/**"
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "electron/**"
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Validate backend syntax
        run: node --check server/index.mjs

      - name: Typecheck renderer
        run: npm run typecheck

      - name: Compile Electron
        run: npm run build:electron

      - name: Build renderer
        run: npm run build:web

      - name: Build self-contained packaged API
        run: npm run build:server

      - name: Package smoke build
        run: npx electron-builder --win --dir

      - name: Smoke test packaged local API
        shell: pwsh
        run: |
          $exe = Resolve-Path "release/win-unpacked/LockOn ServiceOS.exe"
          $server = Resolve-Path "release/win-unpacked/resources/app.asar.unpacked/dist-server/index.cjs"
          $data = Join-Path $env:RUNNER_TEMP "lockon-smoke-database.json"
          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:LOCKON_API_HOST = "127.0.0.1"
          $env:LOCKON_API_PORT = "18787"
          $env:LOCKON_DATA_FILE = $data
          $env:LOCKON_OWNER_EMAIL = "nowogar@gmail.com"
          $env:LOCKON_GOOGLE_CLIENT_ID = "996585439932-e10mu53j95s6u13vrua841tm4oco38so.apps.googleusercontent.com"

          $process = Start-Process -FilePath $exe -ArgumentList @($server) -WorkingDirectory $env:RUNNER_TEMP -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 350
              if ($process.HasExited) {
                throw "Pakietowany backend zakończył się przed uruchomieniem."
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18787/health" -TimeoutSec 2
                if ($health.ok -eq $true) {
                  $ok = $true
                  break
                }
              } catch {}
            }
            if (-not $ok) {
              throw "Pakietowany backend nie odpowiedział na /health."
            }
          } finally {
            if (-not $process.HasExited) { $process.Kill() }
          }

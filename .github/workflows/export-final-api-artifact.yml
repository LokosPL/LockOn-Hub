name: Export final Neon production artifact

on:
  push:
    paths:
      - ".github/workflows/export-final-api-artifact.yml"

permissions:
  contents: write
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout technical branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download exact verified artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .temp
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10613501910/zip" \
            -o .temp/prod-final.zip
          echo "38314d09ec3a1d21bfed0807c66c76017d0465f5afcb690abe943e3c3e38cb3f  .temp/prod-final.zip" | sha256sum -c -
          unzip -t .temp/prod-final.zip
          base64 -w0 .temp/prod-final.zip > .temp/prod-final.b64

      - name: Commit encoded verified artifact
        shell: bash
        run: |
          git config user.name "lockon-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .temp/prod-final.b64
          git commit -m "chore: stage verified v1.0.0.0 Neon artifact"
          git push origin HEAD:${GITHUB_REF_NAME}

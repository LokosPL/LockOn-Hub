name: Export verified lockonapi v19 artifact

on:
  push:
    branches: ["ops/deploy-lockonapi-v19"]
    paths:
      - ".github/workflows/export-lockonapi-v19.yml"

permissions:
  contents: write
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download exact verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10580450373/zip" \
            -o lockon-central-api.zip
          echo "e67abff0ed5fe001ada06103ac652ddfce4f14a4188031bcb26d7d75f00ef3ee  lockon-central-api.zip" | sha256sum -c -
      - name: Export base64 handoff
        shell: bash
        run: |
          mkdir -p .deploy
          base64 -w 4000 lockon-central-api.zip > .deploy/lockonapi-v19.zip.b64
          printf '%s\n' "e67abff0ed5fe001ada06103ac652ddfce4f14a4188031bcb26d7d75f00ef3ee" > .deploy/lockonapi-v19.zip.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/lockonapi-v19.zip.b64 .deploy/lockonapi-v19.zip.sha256
          git commit -m "Export verified lockonapi v19 artifact"
          git push

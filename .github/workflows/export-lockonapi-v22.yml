name: Export verified lockonapi v22 artifact

on:
  push:
    branches: ["ops/deploy-lockonapi-v22"]
    paths:
      - ".github/workflows/export-lockonapi-v22.yml"

permissions:
  contents: write
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download exact verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10580488145/zip" \
            -o lockon-central-api.zip
          echo "07a5677e31ea593d84e756552c3031ce73a22b095295f6d646ee16f34d7bb8c7  lockon-central-api.zip" | sha256sum -c -
      - name: Export base64 handoff
        shell: bash
        run: |
          mkdir -p .deploy
          base64 -w 4000 lockon-central-api.zip > .deploy/lockonapi-v22.zip.b64
          printf '%s\n' "07a5677e31ea593d84e756552c3031ce73a22b095295f6d646ee16f34d7bb8c7" > .deploy/lockonapi-v22.zip.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/lockonapi-v22.zip.b64 .deploy/lockonapi-v22.zip.sha256
          git commit -m "Export verified lockonapi v22 artifact"
          git push

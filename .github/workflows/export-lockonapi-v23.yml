name: Export verified lockonapi v23 artifact

on:
  push:
    branches: ["ops/deploy-lockonapi-v23"]
    paths:
      - ".github/workflows/export-lockonapi-v23.yml"

permissions:
  contents: write
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download exact verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10582896636/zip" \
            -o lockon-central-api.zip
          echo "69f7093b152040541354631ba4378e6e19f8ebbb64e37eb959a0bc0bead14a66  lockon-central-api.zip" | sha256sum -c -
      - name: Export base64 handoff
        shell: bash
        run: |
          mkdir -p .deploy
          base64 -w 4000 lockon-central-api.zip > .deploy/lockonapi-v23.zip.b64
          printf '%s\n' "69f7093b152040541354631ba4378e6e19f8ebbb64e37eb959a0bc0bead14a66" > .deploy/lockonapi-v23.zip.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/lockonapi-v23.zip.b64 .deploy/lockonapi-v23.zip.sha256
          git commit -m "Export verified lockonapi v23 artifact"
          git push

name: Generate 1.0.0.20 LiveKit lockfile

on:
  push:
    branches: ["feature/1.0.0.20-user-gmail-meetings"]
    paths:
      - "package.json"
      - ".github/workflows/livekit-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Generate exact npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
          else
            git commit -m "chore: lock LiveKit client dependency"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

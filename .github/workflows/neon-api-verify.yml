name: Verify Neon API bundle

on:
  push:
    branches: ["main", "release/**"]
    paths:
      - "functions/lockon-api.mjs"
      - "functions/meeting-policy.mjs"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - "database/migrations/**"
      - "database/schema.sql"
      - ".github/workflows/neon-api-verify.yml"
      - ".github/workflows/central-api-bundle.yml"
      - ".github/workflows/temp-neon-smoke.yml"
  pull_request:
    paths:
      - "functions/lockon-api.mjs"
      - "functions/meeting-policy.mjs"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - "database/migrations/**"
      - "database/schema.sql"
      - ".github/workflows/neon-api-verify.yml"
      - ".github/workflows/central-api-bundle.yml"
      - ".github/workflows/temp-neon-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install function build dependencies
        run: npm install --no-save --package-lock=false pg@8.16.3 google-auth-library@11.1.0 @aws-sdk/client-s3@3 @aws-sdk/s3-request-presigner@3 pdfmake@0.2.20 livekit-server-sdk@2.19.1 esbuild@0.25.12
      - name: Check source syntax
        run: |
          node --check functions/meeting-policy.mjs
          node --check functions/lockon-api.mjs
      - name: Run meeting regression tests
        run: node --test tests/*.test.mjs
      - name: Verify v0.20 support and customer contracts
        run: |
          grep -q 'support_enabled' functions/lockon-api.mjs
          grep -q '/support/presence' functions/lockon-api.mjs
          grep -q '/support/leave' functions/lockon-api.mjs
          grep -q 'normalizeSupportTarget' functions/lockon-api.mjs
          grep -q 'SELF_SUPPORT_NOT_ALLOWED' functions/lockon-api.mjs
          grep -q "metadata->>'target'='CONSULTANT'" functions/lockon-api.mjs
          grep -q "metadata->>'target' IS NULL" functions/lockon-api.mjs
          grep -q "target:'BOT'" functions/lockon-api.mjs
          grep -q 'SUPPORT_ALREADY_ASSIGNED' functions/lockon-api.mjs
          grep -q 'ORDER_STATUS_CHANGED' functions/lockon-api.mjs
          grep -q 'TRANSFER_STATUS_CHANGED' functions/lockon-api.mjs
          grep -q 'NOTIFICATIONS_FORBIDDEN' functions/lockon-api.mjs
          grep -q 'user_gmail_credentials' functions/lockon-api.mjs
          grep -q 'user_gmail_credentials' database/migrations/2026-09-24-v100020-user-gmail-credentials.sql
          grep -Fq 'LEFT JOIN user_gmail_credentials e ON e.user_id=n.user_id' functions/lockon-api.mjs
          grep -Fq 'const loadUserMailSender = async (userId)' functions/lockon-api.mjs
          grep -Fq 'senderUserId:u.id' functions/lockon-api.mjs
          grep -q 'GMAIL_IDENTITY_MISMATCH' functions/lockon-api.mjs
          grep -q 'googleIdentityMatchesUser' functions/lockon-api.mjs
          ! grep -Fq 'const loadActiveMailSender = async' functions/lockon-api.mjs
          ! grep -Fq 'LEFT JOIN LATERAL (SELECT pe.point_id AS sender_point_id' functions/lockon-api.mjs
          grep -q 'MEETING_CREATE_ROLES' functions/lockon-api.mjs
      grep -q 'MEETING_GLOBAL_MANAGE_ROLES' functions/lockon-api.mjs
          grep -q "url.pathname==='/meetings'" functions/lockon-api.mjs
          grep -q 'meeting_audience' database/migrations/2026-09-24-v100020-meetings.sql
          grep -q 'meeting_registrations' database/migrations/2026-09-24-v100020-meetings.sql
          grep -q 'meeting_attendance' database/migrations/2026-09-24-v100020-meetings.sql
          grep -q 'meeting_email_outbox' database/migrations/2026-09-24-v100020-meetings.sql
          grep -q 'meeting_participant_controls' database/migrations/2026-09-24-v100020-meetings.sql
          grep -q 'meeting_email_sender' database/migrations/2026-09-24-v100020-meetings.sql
          grep -q 'LIVEKIT_URL' functions/lockon-api.mjs
          grep -q 'LIVEKIT_API_KEY' functions/lockon-api.mjs
          grep -q 'LIVEKIT_API_SECRET' functions/lockon-api.mjs
          grep -q '/join-token' functions/lockon-api.mjs
          grep -q 'canPublishSources' functions/lockon-api.mjs
          grep -q '/moderate' functions/lockon-api.mjs
          grep -q 'queueMeetingEmailEvent' functions/lockon-api.mjs
          grep -q 'MEETING_RESCHEDULED' functions/lockon-api.mjs
          grep -q "method==='PATCH'&&meetingUpdate" functions/lockon-api.mjs
          grep -q "'RESCHEDULED:'" functions/lockon-api.mjs
          grep -q "value === null || value === undefined || value === ''" functions/lockon-api.mjs
          grep -q 'consultant_requested_at' functions/lockon-api.mjs
          grep -q 'customer_portal_code' functions/lockon-api.mjs
          grep -q "JOIN customers c ON c.id=s.customer_id LEFT JOIN customer_portal_accounts ca ON ca.customer_id=c.id JOIN devices" functions/lockon-api.mjs
          grep -q "error: 'WEB_CODE_ONLY'" functions/lockon-api.mjs
          grep -q '/website/redeem' functions/lockon-api.mjs
          grep -q 'consumePublicAuthAttempt' functions/lockon-api.mjs
          grep -q 'PUBLIC_CODE_ATTEMPT_LIMIT' functions/lockon-api.mjs
          grep -q "'customer-code'" functions/lockon-api.mjs
          grep -q "'customer-google'" functions/lockon-api.mjs
          grep -q "code: 'RATE_LIMITED'" functions/lockon-api.mjs
          grep -q 'GOOGLE_CUSTOMER_WEB_CLIENT_ID' functions/lockon-api.mjs
          grep -q '/public/customer-portal/google/login' functions/lockon-api.mjs
          grep -q '/public/customer-portal/google/link' functions/lockon-api.mjs
          grep -q "CUSTOMER_FULL_ACCOUNT_REQUIRED" functions/lockon-api.mjs
          ! grep -q "loginProfile(profile, 'WEB'" functions/lockon-api.mjs
          grep -q "type:'SPEED_TEST'" functions/lockon-api.mjs
          grep -q "type:'CONNECTIVITY_TEST'" functions/lockon-api.mjs
          grep -q "type:'BROWSER_SEARCH'" functions/lockon-api.mjs
          grep -q 'support_enabled' database/migrations/2026-09-19-v020-support-capability.sql
          grep -q 'diagnostics-v020' database/migrations/2026-09-19-v020-assistant-knowledge.sql
          grep -q 'customer_portal_accounts' database/migrations/2026-09-20-customer-accounts-google.sql
          grep -q "auth_method IN ('CODE','GOOGLE')" database/migrations/2026-09-20-customer-accounts-google.sql
          grep -q '/customer-accounts' functions/lockon-api.mjs
          grep -q "SERVICE_INVOICE_BUCKET = 'service-invoices'" functions/lockon-api.mjs
          grep -q "TECHNICIAN_ORDER_REQUIRED" functions/lockon-api.mjs
          grep -q "/service/technician-workspace" functions/lockon-api.mjs
          grep -q "/service/technician-notes" functions/lockon-api.mjs
          grep -q "/service/invoices/download-batch" functions/lockon-api.mjs
          grep -q "SERVICE_INTAKE_CARD" functions/lockon-api.mjs
          grep -q "/service/scan" functions/lockon-api.mjs
          grep -Fq "const serviceCardMatch=url.pathname.match" functions/lockon-api.mjs
          grep -q "COMPLAINT_FLOW" functions/lockon-api.mjs
          grep -q "customerPortalAutoUrl" functions/lockon-api.mjs
          grep -q "v1000-service-cards" database/migrations/2026-09-20-v1000-service-cards.sql
          grep -q "service_orders_handling_mode_v1000_check" database/migrations/2026-09-20-v1000-service-cards.sql
          grep -q "NOT VALID" database/migrations/2026-09-20-v1000-service-cards.sql
          grep -q "VALIDATE CONSTRAINT" database/migrations/2026-09-20-v1000-service-cards.sql
          grep -q "magic!=='%PDF-'" functions/lockon-api.mjs
          grep -q "service_order_parts" database/migrations/2026-09-20-v021-service-finance-invoices.sql
          grep -q "service_order_invoices" database/migrations/2026-09-20-v021-service-finance-invoices.sql
          grep -q "technician_private_notes" database/migrations/2026-09-20-v021-service-finance-invoices.sql
          grep -Fq "COALESCE(s.current_point_id,s.home_point_id,s.point_id)" functions/lockon-api.mjs
          grep -Fq "t.status IN ('REQUESTED','IN_TRANSIT','DELIVERED')" functions/lockon-api.mjs
          grep -Fq '!firstName||!lastName||!issue' functions/lockon-api.mjs
          grep -Fq "canSetIntakeEta=SERVICE_CREATE_ROLES.has(u.role_code)" functions/lockon-api.mjs
          grep -Fq "brandInput||'Nie podano'" functions/lockon-api.mjs
          grep -Fq "deviceNotes=cleanText(body.deviceNotes,1000)||'Brak uwag'" functions/lockon-api.mjs
          grep -Fq 'IMEI powinien zawierać 14–16 cyfr.' functions/lockon-api.mjs
          grep -Fq 'TECHNICIAN_AT_INTAKE' functions/lockon-api.mjs
          grep -Fq "serviceCardNumber='KS-'" functions/lockon-api.mjs
          grep -Fq 'customerPortalBaseUrl' functions/lockon-api.mjs
          grep -Fq 'Warunki przyjęcia i odbioru' functions/lockon-api.mjs
          grep -Fq 'Nieodebranie urządzenia nie oznacza porzucenia ani przeniesienia własności na sklep' functions/lockon-api.mjs
          grep -Fq 'szkody będące następstwem utraty' functions/lockon-api.mjs
          grep -Fq "serviceCardTermsBlock({titleFontSize:11.5,fontSize:8.8,marginTop:10})" functions/lockon-api.mjs
          grep -Fq "labelFontSize:10,valueFontSize:11,rowMargin:3" functions/lockon-api.mjs
          grep -Fq 'Zeskanuj kod QR w ServiceOS, aby otworzyć zlecenie i obsłużyć urządzenie.' functions/lockon-api.mjs
          grep -Fq 'Kod ręczny — użyj, gdy nie możesz zeskanować QR.' functions/lockon-api.mjs
          grep -Fq 'const customerServiceCardPortraitContent' functions/lockon-api.mjs
          grep -Fq "if(normalized==='CUSTOMER')" functions/lockon-api.mjs
          grep -Fq "pageSize:'A4',pageOrientation:'portrait',pageMargins:[30,24,30,24]" functions/lockon-api.mjs
          grep -Fq 'formatServiceCardDateTime(context.receivedAt)' functions/lockon-api.mjs
          grep -Fq 'Przyjęcie i urządzenie' functions/lockon-api.mjs
          grep -Fq 'Obsługa serwisowa' functions/lockon-api.mjs
          grep -Fq "renderServiceCardPdf(item.service_order_id,'CUSTOMER')" functions/lockon-api.mjs
          grep -Fq "const OWNER_OPERATIONAL_NAME = 'System LockOn'" functions/lockon-api.mjs
          grep -Fq "const OWNER_SUPPORT_NAME = 'Właściciel aplikacji'" functions/lockon-api.mjs
          grep -Fq 'canSetIntakeEstimate=SERVICE_CREATE_ROLES.has(u.role_code)' functions/lockon-api.mjs
          grep -Fq '!firstName||!lastName||!issue' functions/lockon-api.mjs
          grep -Fq 'SELECT id FROM service_orders WHERE id=$1 FOR UPDATE' functions/lockon-api.mjs
      - name: Bundle for Neon Functions
        run: |
          mkdir -p central-api-dist
          npx esbuild functions/lockon-api.mjs --bundle --platform=node --target=node24 --format=esm --banner:js="import{createRequire as ___cr}from'module';import{fileURLToPath as ___f}from'url';import{dirname as ___d}from'path';const require=___cr(import.meta.url);const __filename=___f(import.meta.url);const __dirname=___d(__filename);" --outfile=central-api-dist/index.mjs
      - name: Upload verified Neon bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lockon-central-api
          path: central-api-dist/index.mjs
          if-no-files-found: error
          retention-days: 3

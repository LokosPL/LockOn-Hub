name: P0A temp Neon smoke

on:
  push:
    branches: ["fix/p0a-support-bot-parallel"]
    paths:
      - ".github/workflows/p0a-temp-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: https://br-cool-glitter-b1pcikxf-lockonapi.compute.c-5.eu-central-1.aws.neon.tech/
    steps:
      - name: Verify parallel bot and consultant routing
        shell: bash
        run: |
          node <<'NODE'
          const api = process.env.API_URL;
          const repoId = process.env.GITHUB_REPOSITORY_ID;
          const owner = 'p0a-' + repoId + '-61-owner';
          const user = 'p0a-' + repoId + '-61-user';
          const marker = 'P0A-' + Date.now();

          const call = async (path, token, method = 'GET', body, expected = 200) => {
            const response = await fetch(new URL(path.replace(/^\//,''), api), {
              method,
              headers: {
                ...(token ? { Authorization: 'Bearer ' + token } : {}),
                ...(body === undefined ? {} : { 'Content-Type': 'application/json' })
              },
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            let payload = null;
            try { payload = await response.json(); } catch {}
            if (response.status !== expected) {
              throw new Error(method + ' ' + path + ' -> ' + response.status + ' ' + JSON.stringify(payload));
            }
            return payload;
          };

          const health = await call('/health', null);
          if (health?.ok !== true) throw new Error('health failed');

          const ownerBot = await call('/assistant/chat', owner, 'POST', { message: 'P0A owner bot ' + marker, target: 'BOT' });
          if (!ownerBot?.assistantMessage || ownerBot?.consultantState !== 'BOT') {
            throw new Error('OWNER bot did not answer after self-assignment repair');
          }

          await call('/support/request', owner, 'POST', { message: 'P0A SELF ' + marker });
          const ownerConversation = await call('/support/conversation', owner);
          const selfTake = await call('/support/tickets/' + ownerConversation.id + '/take', owner, 'POST', {}, 409);
          if (selfTake?.error !== 'SELF_SUPPORT_NOT_ALLOWED') {
            throw new Error('self-take was not blocked');
          }
          await call('/support/leave', owner, 'POST', {});

          await call('/support/request', user, 'POST', { message: 'P0A HUMAN REQUEST ' + marker });
          const userConversation = await call('/support/conversation', user);
          await call('/support/tickets/' + userConversation.id + '/take', owner, 'POST', {});
          const joined = await call('/support/conversation', user);
          if (joined?.consultantState !== 'JOINED') throw new Error('consultant did not join');

          const botPrivate = 'P0A BOT PRIVATE ' + marker;
          const humanOnly = 'P0A HUMAN ONLY ' + marker;
          const botReply = await call('/assistant/chat', user, 'POST', { message: botPrivate, target: 'BOT' });
          if (!botReply?.assistantMessage || botReply?.consultantState !== 'JOINED') {
            throw new Error('bot stopped while consultant joined');
          }

          const humanReply = await call('/assistant/chat', user, 'POST', { message: humanOnly, target: 'CONSULTANT' });
          if (humanReply?.assistantMessage !== null || humanReply?.consultantState !== 'JOINED') {
            throw new Error('consultant-targeted message generated bot reply');
          }

          const tickets = await call('/support/tickets', owner);
          const ticket = tickets?.find?.((item) => item.id === userConversation.id);
          if (!ticket) throw new Error('joined ticket missing from support desk');
          const texts = ticket.messages.map((message) => message.text);
          if (!texts.includes(humanOnly)) throw new Error('consultant message missing from support desk');
          if (texts.includes(botPrivate)) throw new Error('private bot message leaked to support desk');

          await call('/support/leave', user, 'POST', {});
          const afterLeave = await call('/support/conversation', user);
          if (afterLeave?.consultantState !== 'BOT') throw new Error('leave did not return to BOT');
          if (!afterLeave.messages.some((message) => message.text === botPrivate && message.target === 'BOT')) {
            throw new Error('bot history was not preserved');
          }

          console.log('P0A temp Neon smoke PASS');
          NODE

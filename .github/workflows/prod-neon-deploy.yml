name: Deploy production Neon API

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/prod-neon-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockon-prod-neon-deploy
  cancel-in-progress: false

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: wandering-field-13057181
      NEON_BRANCH_ID: br-steep-bonus-b1f1qh8u
      NEON_FUNCTION_SLUG: lockonapi
      PROD_API_URL: https://br-steep-bonus-b1f1qh8u-lockonapi.compute.c-5.eu-central-1.aws.neon.tech
      PROD_SITE_ORIGIN: https://app.serviceos.pl
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Require production Neon credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEON_API_KEY"

      - name: Build exact production bundle
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false pg@8.16.3 google-auth-library@11.1.0 @aws-sdk/client-s3@3 @aws-sdk/s3-request-presigner@3 pdfmake@0.2.20 esbuild@0.25.12
          node --check functions/lockon-api.mjs
          mkdir -p central-api-dist
          npx esbuild functions/lockon-api.mjs \
            --bundle \
            --platform=node \
            --target=node24 \
            --format=esm \
            --banner:js="import{createRequire as ___cr}from'module';import{fileURLToPath as ___f}from'url';import{dirname as ___d}from'path';const require=___cr(import.meta.url);const __filename=___f(import.meta.url);const __dirname=___d(__filename);" \
            --outfile=central-api-dist/index.mjs
          zip -j prod-neon-lockonapi.zip central-api-dist/index.mjs
          sha256sum prod-neon-lockonapi.zip central-api-dist/index.mjs

      - name: Deploy exact bundle to production Neon
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$NEON_BRANCH_ID/functions/$NEON_FUNCTION_SLUG/deployments"
          http="$(curl --silent --show-error --output deploy.json --write-out '%{http_code}' \
            --request POST "$endpoint" \
            --header "Authorization: Bearer $NEON_API_KEY" \
            --form "zip=@prod-neon-lockonapi.zip")"
          if [[ "$http" -lt 200 || "$http" -ge 300 ]]; then
            echo "::error::Production Neon deploy HTTP $http"
            cat deploy.json
            exit 1
          fi
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('deploy.json','utf8'));
          const id=d.id ?? d.deployment?.id ?? d.deployment_id;
          if(id===undefined || id===null) throw new Error('Neon deploy response has no deployment id');
          console.log('deployment_id='+id);
          NODE

      - name: Wait for deployed production revision
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$NEON_BRANCH_ID/functions/$NEON_FUNCTION_SLUG"
          expected="${{ steps.deploy.outputs.deployment_id }}"
          for attempt in $(seq 1 40); do
            curl --silent --show-error --fail "$endpoint" --header "Authorization: Bearer $NEON_API_KEY" > function.json
            state="$(node -e "const f=require('./function.json');const d=f.current_deployment??f.active_deployment??f.deployment??{};process.stdout.write(String(d.status??''))")"
            active="$(node -e "const f=require('./function.json');const d=f.current_deployment??f.active_deployment??f.deployment??{};process.stdout.write(String(d.id??''))")"
            if [[ "$active" = "$expected" && "$state" = "completed" ]]; then
              exit 0
            fi
            if [[ "$active" = "$expected" && "$state" = "failed" ]]; then
              echo "::error::Production Neon deployment $expected failed."
              cat function.json
              exit 1
            fi
            sleep 3
          done
          echo "::error::Production Neon deployment did not become active."
          cat function.json
          exit 1

      - name: Production health and security headers
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --dump-header health.headers "$PROD_API_URL/health" --output health.json
          node -e "const d=require('./health.json');if(d.ok!==true||d.service!=='LockOn ServiceOS Central API')throw new Error('Production health payload mismatch')"
          grep -qi '^cache-control: no-store' health.headers
          grep -qi '^x-content-type-options: nosniff' health.headers
          grep -qi '^x-frame-options: DENY' health.headers

      - name: Production CORS allowlist
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --dump-header allowed.headers --output /dev/null --request OPTIONS "$PROD_API_URL/health" --header "Origin: $PROD_SITE_ORIGIN" --header "Access-Control-Request-Method: GET"
          grep -qi "^access-control-allow-origin: $PROD_SITE_ORIGIN" allowed.headers
          curl --silent --show-error --dump-header denied.headers --output /dev/null --request OPTIONS "$PROD_API_URL/health" --header "Origin: https://evil.invalid" --header "Access-Control-Request-Method: GET"
          if grep -qi '^access-control-allow-origin:' denied.headers; then
            echo "::error::Production API exposed CORS to an unapproved origin"
            exit 1
          fi

      - name: Production dev login disabled
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in dev-owner dev-role; do
            code="$(curl --silent --show-error --output "$endpoint.json" --write-out '%{http_code}' --request POST "$PROD_API_URL/auth/$endpoint" --header 'Content-Type: application/json' --data '{}')"
            test "$code" = "404"
            node -e "const d=require('./'+process.argv[1]+'.json');if(d.error!=='NOT_FOUND')throw new Error('Unexpected dev-login response')" "$endpoint"
          done

      - name: Production auth guard
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output me.json --write-out '%{http_code}' "$PROD_API_URL/me")"
          test "$code" = "401"

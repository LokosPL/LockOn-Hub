name: One-time production API smoke

on:
  push:
    paths:
      - ".github/workflows/prod-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Protected production smoke
        shell: bash
        env:
          BASE: https://br-steep-bonus-b1f1qh8u-lockonapi.compute.c-5.eu-central-1.aws.neon.tech
        run: |
          set -euo pipefail
          check() {
            method="$1"
            path="$2"
            expected="$3"
            body="${4:-}"
            if [ -n "$body" ]; then
              code="$(curl -sS -o /tmp/resp -w '%{http_code}' --max-time 20 -X "$method" -H 'content-type: application/json' --data "$body" "$BASE$path")"
            else
              code="$(curl -sS -o /tmp/resp -w '%{http_code}' --max-time 20 -X "$method" "$BASE$path")"
            fi
            echo "$method $path -> $code"
            head -c 300 /tmp/resp || true
            echo
            test "$code" = "$expected"
          }
          check GET /health 200
          check GET /me 401
          check GET /service/orders 401
          check GET /finance/revenues 401
          check GET /admin/factory-reset/preview 401
          check POST /admin/factory-reset 401 '{"phrase":"NIE WYKONUJ","confirmed":false}'
          check POST /service/orders/srv_00000000000000000000/status 401 '{"status":"DIAGNOSIS","actingPointId":"pnt_00000000000000000000"}'

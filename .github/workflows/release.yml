name: Build and publish LockOn ServiceOS

on:
  push:
    branches: ["main"]
    paths:
      - "RELEASE_READY"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: lockon-release
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Wait for exact-SHA verification gates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('Verify LockOn ServiceOS', 'CodeQL security scan')
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$env:GITHUB_SHA&per_page=100"

          for ($attempt = 1; $attempt -le 90; $attempt++) {
            $response = Invoke-RestMethod -Uri $url -Headers $headers -Method Get
            $states = @{}
            foreach ($name in $required) {
              $run = $response.workflow_runs |
                Where-Object { $_.name -eq $name -and $_.head_sha -eq $env:GITHUB_SHA } |
                Sort-Object created_at -Descending |
                Select-Object -First 1
              if ($null -ne $run) {
                $states[$name] = "$($run.status)/$($run.conclusion)"
                if ($run.status -eq 'completed' -and $run.conclusion -notin @('success','neutral','skipped')) {
                  Write-Error "Required gate '$name' failed for $env:GITHUB_SHA: $($run.conclusion)"
                  exit 1
                }
              } else {
                $states[$name] = 'missing'
              }
            }

            $ready = $true
            foreach ($name in $required) {
              if ($states[$name] -ne 'completed/success') { $ready = $false }
            }
            Write-Host ("Verification gates: " + (($required | ForEach-Object { "$_=$($states[$_])" }) -join ', '))
            if ($ready) {
              Write-Host "Exact-SHA Verify and CodeQL gates are green."
              exit 0
            }
            Start-Sleep -Seconds 10
          }

          Write-Error "Timed out waiting for Verify LockOn ServiceOS and CodeQL security scan on $env:GITHUB_SHA."
          exit 1

      - name: Verify successful production deployment gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?branch=main&event=workflow_dispatch&status=success&per_page=100"
          $response = Invoke-RestMethod -Uri $url -Headers $headers -Method Get
          $prod = $response.workflow_runs |
            Where-Object { $_.name -eq 'Production Neon exact deploy' -and $_.conclusion -eq 'success' } |
            Sort-Object created_at -Descending |
            Select-Object -First 1

          if ($null -eq $prod) {
            Write-Error "No successful Production Neon exact deploy was found on main."
            exit 1
          }

          $prodSha = [string]$prod.head_sha

          $smokeUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?branch=main&status=success&per_page=100"
          $smokeResponse = Invoke-RestMethod -Uri $smokeUrl -Headers $headers -Method Get
          $expectedSmokeTitle = "Production API smoke · $prodSha"
          $smoke = $smokeResponse.workflow_runs |
            Where-Object { $_.path -eq '.github/workflows/prod-smoke.yml' -and $_.conclusion -eq 'success' -and $_.display_title -eq $expectedSmokeTitle } |
            Sort-Object created_at -Descending |
            Select-Object -First 1
          if ($null -eq $smoke) {
            Write-Error "No successful Production API smoke was found for PROD deployment SHA $prodSha."
            exit 1
          }

          git merge-base --is-ancestor $prodSha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            Write-Error "The successful PROD deployment SHA $prodSha is not an ancestor of release SHA $env:GITHUB_SHA."
            exit 1
          }

          $allowed = @(
            'RELEASE_READY',
            'RELEASE_VERSION',
            'BUILD_VERSION',
            'package.json',
            'package-lock.json',
            'electron/appConfig.ts',
            '.github/workflows/release.yml'
          )
          $changed = @(git diff --name-only $prodSha $env:GITHUB_SHA)
          $unexpected = @($changed | Where-Object { $_ -and $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            Write-Error ("Code changed after the last successful PROD deployment. Re-run TEMP and PROD before release. Unexpected files: " + ($unexpected -join ', '))
            exit 1
          }

          Write-Host "Production deploy + smoke gates verified from $prodSha. Release-only changes: $($changed -join ', ')."

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Check desktop Google OAuth credential
        shell: pwsh
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.LOCKON_GOOGLE_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_SECRET)) {
            Write-Error "Brak GitHub Actions Secret LOCKON_GOOGLE_CLIENT_SECRET."
            exit 1
          }

      - name: Inject desktop Google OAuth credential
        shell: pwsh
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.LOCKON_GOOGLE_CLIENT_SECRET }}
        run: |
          $escaped = $env:GOOGLE_CLIENT_SECRET.Replace("'", "\'")
          "export const GOOGLE_CLIENT_SECRET = '$escaped';" | Set-Content -Path electron/generatedSecrets.ts -Encoding utf8

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Verify release versions and production gate
        id: version
        shell: pwsh
        run: |
          $build = node -p "require('./package.json').version"
          $requestedBuild = (Get-Content BUILD_VERSION -Raw).Trim()
          $product = (Get-Content RELEASE_VERSION -Raw).Trim()
          if ($build -ne $requestedBuild) {
            Write-Error "BUILD_VERSION ($requestedBuild) nie zgadza się z package.json ($build)."
            exit 1
          }
          if ($product -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            Write-Error "RELEASE_VERSION musi mieć format czteroczłonowy, np. 1.0.0.0."
            exit 1
          }
          if ($build -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            Write-Error "BUILD_VERSION musi być poprawnym SemVer dla npm/electron-updater."
            exit 1
          }
          if (-not (Test-Path RELEASE_READY)) {
            Write-Error "Brak RELEASE_READY. Produkcyjny release jest zablokowany do czasu finalnego smoke."
            exit 1
          }
          $ready = (Get-Content RELEASE_READY -Raw).Trim()
          $expected = "$product|$build"
          if ($ready -ne $expected) {
            Write-Error "RELEASE_READY ($ready) nie odpowiada bieżącym wersjom ($expected)."
            exit 1
          }
          "product_version=$product" >> $env:GITHUB_OUTPUT
          "build_version=$build" >> $env:GITHUB_OUTPUT

      - name: Build application
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            "release/LockOn-ServiceOS-Setup.exe",
            "release/LockOn-ServiceOS-Setup.exe.blockmap",
            "release/latest.yml"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          Set-Content -Path release/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/LockOn-ServiceOS-Setup.exe
            release/LockOn-ServiceOS-Setup.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt

      - name: Prepare release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.product_version }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          $highlights = ""
          if ($env:VERSION -eq "1.0.5.23") {
            $highlights = @"

          Najważniejsze zmiany:
          - Nowa ikona ServiceOS: smartfon z pomarańczową orbitą, spójna z ciemnym interfejsem aplikacji i strony.
          - Ikona została podmieniona w ekranie logowania, splash screenie, sidebarze oraz ekranie oczekiwania na dostęp.
          - Instalator Windows i skrót na pulpicie używają tej samej ikony ServiceOS zamiast domyślnej ikony Electron.
          - app.serviceos.pl używa tej samej ikony w nawigacji, makietach, PWA i faviconie.
          "@
          } elseif ($env:VERSION -eq "1.0.5.22") {
            $highlights = @"

          Najważniejsze zmiany:
          - Usunięto duplikujący przycisk Zatrzymaj z dolnego paska pokoju spotkania.
          - Zatrzymanie streamu pozostaje w kontekstowym pasku aktywnej transmisji obok podglądu, Trybu kinowego i zmiany źródła.
          - Zachowano duży ekran spotkania, chat po prawej, persistent LiveKit, host overlay i 4K/60.
          - app.serviceos.pl otrzymało całkowicie przebudowany, prostszy landing w stylu aplikacji z nowymi animacjami i responsywnym układem.
          "@
          } elseif ($env:VERSION -eq "1.0.4.22") {
            $highlights = @"

          Najważniejsze zmiany:
          - Pokój spotkania ma uproszczony układ: jedna dominująca scena, stały panel czatu/uczestników i jeden kompaktowy pasek transmisji.
          - Usunięto duplikujący kafel własnej transmisji.
          - Dodano Tryb kinowy z dużym ekranem i czatem stale widocznym po prawej.
          - Tryb kinowy można włączyć przyciskiem, podwójnym kliknięciem sceny i wyłączyć klawiszem Esc.
          - Miniatury pod sceną pokazują wyłącznie ekrany innych uczestników i pozwalają szybko przełączać główny widok.
          - Zachowano trwałą sesję LiveKit, host overlay, działającą przeglądarkę podczas streamu, 4K/60 do 12 Mb/s i strojenie mikrofonu z wersji 1.0.3.22.
          "@
          } elseif ($env:VERSION -eq "1.0.3.22") {
            $highlights = @"

          Najważniejsze zmiany:
          - Spotkanie, mikrofon i screen share pozostają aktywne po przejściu do Startu, Serwisu, Przeglądarki lub po zminimalizowaniu ServiceOS.
          - Host widzi stałą półprzezroczystą obramówkę transmisji z czasem, liczbą osób, aktywnym mówcą i podglądem czatu.
          - Lokalny podgląd streamu jest domyślnie ukryty, więc pełny ekran ServiceOS nie tworzy już agresywnego efektu lustra.
          - Przeglądarka działa równolegle ze spotkaniem; rozwinięty dock rezerwuje miejsce zamiast wyłączać WebContentsView.
          - Screen share został podniesiony do maks. 4K / 60 FPS i 12 Mb/s z preferencją utrzymania rozdzielczości.
          - Mikrofon ma ustawienia niskiej latencji, 48 kHz, ciągły track przy mute i odporniejszą transmisję RED.
          "@
          } elseif ($env:VERSION -eq "1.0.2.22") {
            $highlights = @"

          Najważniejsze zmiany:
          - Start ma nowy, spójny panel Spotkania i szkolenia z osobnym stanem szkoleń oraz aktywnego spotkania.
          - Serwisant nie widzi akcji zarządzających przeznaczonych dla OWNER/BOSS/COORDINATOR.
          - Pokój spotkania jest większy i prostszy; własny ekran jest pokazywany dopiero po faktycznym rozpoczęciu udostępniania.
          - Screen share priorytetyzuje wysoką rozdzielczość i czytelność obrazu do 4K / 30 fps przy 8 Mb/s.
          - Naprawiono nakładanie natywnej przeglądarki po przejściu do Serwisu podczas aktywnego spotkania.
          - Persistent meeting dock nadal utrzymuje czat i podniesione ręce dostępne podczas pracy w innych modułach.
          "@
          } elseif ($env:VERSION -eq "1.0.1.22") {
            $highlights = @"

          Najważniejsze zmiany:
          - Start został przebudowany jako bardziej kompaktowy, skalowalny pulpit zgodny z trybami widzenia ServiceOS.
          - Spotkania i szkolenia mają nowy hub, wyraźny stan aktywnego spotkania i bezpośredni powrót do pokoju.
          - Prowadzący zachowuje czat i kolejkę podniesionych rąk po przejściu do innych modułów aplikacji.
          - Pokój spotkania pokazuje własny ekran jako główny podgląd oraz pozwala przełączać ekran uczestnika z miniatury na główną scenę.
          - Chat, uczestnicy i sterowanie spotkaniem zostały wizualnie ujednolicone z resztą ServiceOS.
          - Zabezpieczenia LiveKit, role, zakresy punktów i świadomy wybór źródła udostępniania pozostają bez zmian.
          "@
          } elseif ($env:VERSION -eq "1.0.0.22") {
            $highlights = @"

          Najważniejsze zmiany:
          - Spotkania i szkolenia są osobnym modułem, a Start pozostaje użytkowym ekranem z krótkim podsumowaniem.
          - Chat, podnoszenie ręki i wskaźnik aktywnego mówcy działają wewnątrz konkretnego spotkania.
          - Udostępnianie ekranu ma lokalny podgląd, zmianę źródła, spójny cleanup i bezpieczny wskaźnik pełnego ekranu.
          - Powiadomienia e-mail są świadomym opt-in; link spotkania jest stały i nie zawiera tokenu LiveKit.
          - Publiczna strona app.serviceos.pl prezentuje nowy moduł spotkań w responsywnej odsłonie 1.0.0.22.
          "@
          } elseif ($env:VERSION -eq "1.0.0.21") {
            $highlights = @"

          Najważniejsze zmiany:
          - Spotkania i szkolenia: poprawiony lifecycle SCHEDULED/LIVE/ENDED, niezawodne wejście do pokoju, czytelny panel spotkania i moderacja.
          - Szef i koordynator mogą planować spotkania; koordynator działa wyłącznie w zakresie swoich punktów.
          - Logowanie Google kończy się bez potrzeby ponownego uruchamiania aplikacji, nawet gdy dodatkowe usługi Google odpowiadają wolniej.
          - Strona app.serviceos.pl została przebudowana jako pełny, responsywny przewodnik po ServiceOS dla telefonu i laptopa.
          - Ekran Start aplikacji Windows pozostaje w dotychczasowej formie.
          "@
          } elseif ($env:VERSION -eq "1.0.0.20") {
            $highlights = @"

          Najważniejsze zmiany:
          - Gmail nadawcy jest przypisany do zalogowanego pracownika; ServiceOS nie przełącza wiadomości na konto innej osoby ani innego punktu.
          - Spotkania i szkolenia w Dashboardzie: zapisy, audio, udostępnianie ekranu, moderacja prowadzącego i frekwencja.
          - Zaproszenia na spotkania używają odseparowanego sendera administracyjnego i nie mieszają się z wiadomościami serwisowymi.
          - Usprawniony front-desk USER, obsługa klientów i przepływy serwisowe.
          "@
          }

          $notes = @"
          Oficjalne wydanie LockOn ServiceOS v$env:VERSION.

          Techniczny build aktualizatora: $env:BUILD_VERSION.
          $highlights

          Pobierz **LockOn-ServiceOS-Setup.exe**.
          Instalator i pliki aktualizatora powstały w tym workflow i mają poświadczenie pochodzenia buildu w GitHub Artifact Attestations.

          Code signing policy:
          https://github.com/LokosPL/LockOn-Hub/blob/main/CODE_SIGNING.md

          Do czasu akceptacji projektu przez SignPath Foundation instalator może pozostawać niepodpisany.
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.product_version }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          gh release create "v$env:BUILD_VERSION" "release/LockOn-ServiceOS-Setup.exe" "release/LockOn-ServiceOS-Setup.exe.blockmap" "release/latest.yml" "release/SHA256SUMS.txt" --title "LockOn ServiceOS v$env:VERSION" --notes-file release-notes.md --latest

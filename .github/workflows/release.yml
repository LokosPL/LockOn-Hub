name: Build and publish LockOn ServiceOS

on:
  push:
    paths:
      - "RELEASE"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockon-release
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Google OAuth build secret
        shell: pwsh
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.LOCKON_GOOGLE_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_SECRET)) {
            Write-Error "Brak sekretu LOCKON_GOOGLE_CLIENT_SECRET."
            exit 1
          }

      - name: Inject Google OAuth secret
        shell: pwsh
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.LOCKON_GOOGLE_CLIENT_SECRET }}
        run: |
          $escaped = $env:GOOGLE_CLIENT_SECRET.Replace("'", "\\'")
          "export const GOOGLE_CLIENT_SECRET = '$escaped';" | Set-Content -Path electron/generatedSecrets.ts -Encoding utf8

      - name: Install dependencies
        run: npm install

      - name: Typecheck renderer
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Verify release version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $requested = (Get-Content RELEASE -Raw).Trim()
          if ($version -ne $requested) {
            Write-Error "RELEASE ($requested) nie zgadza się z package.json ($version)."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: LockOn ServiceOS v${{ steps.version.outputs.version }}
          body: |
            Oficjalne wydanie LockOn ServiceOS.

            Pobierz **LockOn-ServiceOS-Setup.exe**. Kolejne wersje aplikacja wykrywa przez GitHub Releases.
          make_latest: true
          overwrite_files: true
          files: |
            release/LockOn-ServiceOS-Setup.exe
            release/LockOn-ServiceOS-Setup.exe.blockmap
            release/latest.yml

name: Build and publish LockOn ServiceOS

on:
  push:
    branches: ["main"]
    paths:
      - "RELEASE_READY"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: lockon-release
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Check desktop Google OAuth credential
        shell: pwsh
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.LOCKON_GOOGLE_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_SECRET)) {
            Write-Error "Brak GitHub Actions Secret LOCKON_GOOGLE_CLIENT_SECRET."
            exit 1
          }

      - name: Inject desktop Google OAuth credential
        shell: pwsh
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.LOCKON_GOOGLE_CLIENT_SECRET }}
        run: |
          $escaped = $env:GOOGLE_CLIENT_SECRET.Replace("'", "\'")
          "export const GOOGLE_CLIENT_SECRET = '$escaped';" | Set-Content -Path electron/generatedSecrets.ts -Encoding utf8

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Verify release versions and production gate
        id: version
        shell: pwsh
        run: |
          $build = node -p "require('./package.json').version"
          $requestedBuild = (Get-Content BUILD_VERSION -Raw).Trim()
          $product = (Get-Content RELEASE_VERSION -Raw).Trim()
          if ($build -ne $requestedBuild) {
            Write-Error "BUILD_VERSION ($requestedBuild) nie zgadza się z package.json ($build)."
            exit 1
          }
          if ($product -notmatch '^\d+\.\d+\.\d+\.\d+
      - name: Build application
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            "release/LockOn-ServiceOS-Setup.exe",
            "release/LockOn-ServiceOS-Setup.exe.blockmap",
            "release/latest.yml"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          Set-Content -Path release/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/LockOn-ServiceOS-Setup.exe
            release/LockOn-ServiceOS-Setup.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt

      - name: Prepare release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.product_version }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          $notes = @"
          Oficjalne wydanie LockOn ServiceOS v$env:VERSION.

          Techniczny build aktualizatora: $env:BUILD_VERSION.

          Pobierz **LockOn-ServiceOS-Setup.exe**.
          Instalator i pliki aktualizatora powstały w tym workflow i mają poświadczenie pochodzenia buildu w GitHub Artifact Attestations.

          Code signing policy:
          https://github.com/LokosPL/LockOn-Hub/blob/main/CODE_SIGNING.md

          Do czasu akceptacji projektu przez SignPath Foundation instalator może pozostawać niepodpisany.
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.product_version }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          gh release create "v$env:BUILD_VERSION" "release/LockOn-ServiceOS-Setup.exe" "release/LockOn-ServiceOS-Setup.exe.blockmap" "release/latest.yml" "release/SHA256SUMS.txt" --title "LockOn ServiceOS v$env:VERSION" --notes-file release-notes.md --latest
) {
            Write-Error "RELEASE_VERSION musi mieć format czteroczłonowy, np. 1.0.0.0."
            exit 1
          }
          if ($build -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?
      - name: Build application
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            "release/LockOn-ServiceOS-Setup.exe",
            "release/LockOn-ServiceOS-Setup.exe.blockmap",
            "release/latest.yml"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          Set-Content -Path release/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/LockOn-ServiceOS-Setup.exe
            release/LockOn-ServiceOS-Setup.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt

      - name: Prepare release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.product_version }}
        run: |
          $notes = @"
          Oficjalne wydanie LockOn ServiceOS v$env:VERSION.

          Pobierz **LockOn-ServiceOS-Setup.exe**.
          Instalator i pliki aktualizatora powstały w tym workflow i mają poświadczenie pochodzenia buildu w GitHub Artifact Attestations.

          Code signing policy:
          https://github.com/LokosPL/LockOn-Hub/blob/main/CODE_SIGNING.md

          Do czasu akceptacji projektu przez SignPath Foundation instalator może pozostawać niepodpisany.
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.product_version }}
        run: |
          gh release create "v$env:VERSION" "release/LockOn-ServiceOS-Setup.exe" "release/LockOn-ServiceOS-Setup.exe.blockmap" "release/latest.yml" "release/SHA256SUMS.txt" --title "LockOn ServiceOS v$env:VERSION" --notes-file release-notes.md --latest
) {
            Write-Error "BUILD_VERSION musi być poprawnym SemVer dla npm/electron-updater."
            exit 1
          }
          if (-not (Test-Path RELEASE_READY)) {
            Write-Error "Brak RELEASE_READY. Produkcyjny release jest zablokowany do czasu finalnego smoke."
            exit 1
          }
          $ready = (Get-Content RELEASE_READY -Raw).Trim()
          $expected = "$product|$build"
          if ($ready -ne $expected) {
            Write-Error "RELEASE_READY ($ready) nie odpowiada bieżącym wersjom ($expected)."
            exit 1
          }
          "product_version=$product" >> $env:GITHUB_OUTPUT
          "build_version=$build" >> $env:GITHUB_OUTPUT

      - name: Build application
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            "release/LockOn-ServiceOS-Setup.exe",
            "release/LockOn-ServiceOS-Setup.exe.blockmap",
            "release/latest.yml"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          Set-Content -Path release/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/LockOn-ServiceOS-Setup.exe
            release/LockOn-ServiceOS-Setup.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt

      - name: Prepare release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.product_version }}
        run: |
          $notes = @"
          Oficjalne wydanie LockOn ServiceOS v$env:VERSION.

          Pobierz **LockOn-ServiceOS-Setup.exe**.
          Instalator i pliki aktualizatora powstały w tym workflow i mają poświadczenie pochodzenia buildu w GitHub Artifact Attestations.

          Code signing policy:
          https://github.com/LokosPL/LockOn-Hub/blob/main/CODE_SIGNING.md

          Do czasu akceptacji projektu przez SignPath Foundation instalator może pozostawać niepodpisany.
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.product_version }}
        run: |
          gh release create "v$env:VERSION" "release/LockOn-ServiceOS-Setup.exe" "release/LockOn-ServiceOS-Setup.exe.blockmap" "release/latest.yml" "release/SHA256SUMS.txt" --title "LockOn ServiceOS v$env:VERSION" --notes-file release-notes.md --latest

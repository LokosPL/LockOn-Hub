name: Build and publish LockOn ServiceOS

on:
  push:
    branches: ["main"]
    paths:
      - "RELEASE_READY"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: lockon-release
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Wait for exact-SHA verification gates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('Verify LockOn ServiceOS', 'CodeQL security scan')
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$env:GITHUB_SHA&per_page=100"

          for ($attempt = 1; $attempt -le 90; $attempt++) {
            $response = Invoke-RestMethod -Uri $url -Headers $headers -Method Get
            $states = @{}
            foreach ($name in $required) {
              $run = $response.workflow_runs |
                Where-Object { $_.name -eq $name -and $_.head_sha -eq $env:GITHUB_SHA } |
                Sort-Object created_at -Descending |
                Select-Object -First 1
              if ($null -ne $run) {
                $states[$name] = "$($run.status)/$($run.conclusion)"
                if ($run.status -eq 'completed' -and $run.conclusion -notin @('success','neutral','skipped')) {
                  Write-Error "Required gate '$name' failed for $env:GITHUB_SHA: $($run.conclusion)"
                  exit 1
                }
              } else {
                $states[$name] = 'missing'
              }
            }

            $ready = $true
            foreach ($name in $required) {
              if ($states[$name] -ne 'completed/success') { $ready = $false }
            }
            Write-Host ("Verification gates: " + (($required | ForEach-Object { "$_=$($states[$_])" }) -join ', '))
            if ($ready) {
              Write-Host "Exact-SHA Verify and CodeQL gates are green."
              exit 0
            }
            Start-Sleep -Seconds 10
          }

          Write-Error "Timed out waiting for Verify LockOn ServiceOS and CodeQL security scan on $env:GITHUB_SHA."
          exit 1

      - name: Verify successful production deployment gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?branch=main&event=workflow_dispatch&status=success&per_page=100"
          $response = Invoke-RestMethod -Uri $url -Headers $headers -Method Get
          $prod = $response.workflow_runs |
            Where-Object { $_.name -eq 'Production Neon exact deploy' -and $_.conclusion -eq 'success' } |
            Sort-Object created_at -Descending |
            Select-Object -First 1

          if ($null -eq $prod) {
            Write-Error "No successful Production Neon exact deploy was found on main."
            exit 1
          }

          $prodSha = [string]$prod.head_sha

          $smokeUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?branch=main&event=workflow_run&status=success&per_page=100"
          $smokeResponse = Invoke-RestMethod -Uri $smokeUrl -Headers $headers -Method Get
          $expectedSmokeTitle = "Production API smoke · $prodSha"
          $smoke = $smokeResponse.workflow_runs |
            Where-Object { $_.name -eq 'Production API smoke' -and $_.conclusion -eq 'success' -and $_.display_title -eq $expectedSmokeTitle } |
            Sort-Object created_at -Descending |
            Select-Object -First 1
          if ($null -eq $smoke) {
            Write-Error "No successful Production API smoke was found for PROD deployment SHA $prodSha."
            exit 1
          }

          git merge-base --is-ancestor $prodSha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            Write-Error "The successful PROD deployment SHA $prodSha is not an ancestor of release SHA $env:GITHUB_SHA."
            exit 1
          }

          $allowed = @(
            'RELEASE_READY',
            'RELEASE_VERSION',
            'BUILD_VERSION',
            'package.json',
            'package-lock.json',
            'electron/appConfig.ts'
          )
          $changed = @(git diff --name-only $prodSha $env:GITHUB_SHA)
          $unexpected = @($changed | Where-Object { $_ -and $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            Write-Error ("Code changed after the last successful PROD deployment. Re-run TEMP and PROD before release. Unexpected files: " + ($unexpected -join ', '))
            exit 1
          }

          Write-Host "Production deploy + smoke gates verified from $prodSha. Release-only changes: $($changed -join ', ')."

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Check desktop Google OAuth credential
        shell: pwsh
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.LOCKON_GOOGLE_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_SECRET)) {
            Write-Error "Brak GitHub Actions Secret LOCKON_GOOGLE_CLIENT_SECRET."
            exit 1
          }

      - name: Inject desktop Google OAuth credential
        shell: pwsh
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.LOCKON_GOOGLE_CLIENT_SECRET }}
        run: |
          $escaped = $env:GOOGLE_CLIENT_SECRET.Replace("'", "\'")
          "export const GOOGLE_CLIENT_SECRET = '$escaped';" | Set-Content -Path electron/generatedSecrets.ts -Encoding utf8

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Verify release versions and production gate
        id: version
        shell: pwsh
        run: |
          $build = node -p "require('./package.json').version"
          $requestedBuild = (Get-Content BUILD_VERSION -Raw).Trim()
          $product = (Get-Content RELEASE_VERSION -Raw).Trim()
          if ($build -ne $requestedBuild) {
            Write-Error "BUILD_VERSION ($requestedBuild) nie zgadza się z package.json ($build)."
            exit 1
          }
          if ($product -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            Write-Error "RELEASE_VERSION musi mieć format czteroczłonowy, np. 1.0.0.0."
            exit 1
          }
          if ($build -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            Write-Error "BUILD_VERSION musi być poprawnym SemVer dla npm/electron-updater."
            exit 1
          }
          if (-not (Test-Path RELEASE_READY)) {
            Write-Error "Brak RELEASE_READY. Produkcyjny release jest zablokowany do czasu finalnego smoke."
            exit 1
          }
          $ready = (Get-Content RELEASE_READY -Raw).Trim()
          $expected = "$product|$build"
          if ($ready -ne $expected) {
            Write-Error "RELEASE_READY ($ready) nie odpowiada bieżącym wersjom ($expected)."
            exit 1
          }
          "product_version=$product" >> $env:GITHUB_OUTPUT
          "build_version=$build" >> $env:GITHUB_OUTPUT

      - name: Build application
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            "release/LockOn-ServiceOS-Setup.exe",
            "release/LockOn-ServiceOS-Setup.exe.blockmap",
            "release/latest.yml"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          Set-Content -Path release/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/LockOn-ServiceOS-Setup.exe
            release/LockOn-ServiceOS-Setup.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt

      - name: Prepare release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.product_version }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          $highlights = ""
          if ($env:VERSION -eq "1.0.0.20") {
            $highlights = @"

          Najważniejsze zmiany:
          - Gmail nadawcy jest przypisany do zalogowanego pracownika; ServiceOS nie przełącza wiadomości na konto innej osoby ani innego punktu.
          - Spotkania i szkolenia w Dashboardzie: zapisy, audio, udostępnianie ekranu, moderacja prowadzącego i frekwencja.
          - Zaproszenia na spotkania używają odseparowanego sendera administracyjnego i nie mieszają się z wiadomościami serwisowymi.
          - Usprawniony front-desk USER, obsługa klientów i przepływy serwisowe.
          "@
          }

          $notes = @"
          Oficjalne wydanie LockOn ServiceOS v$env:VERSION.

          Techniczny build aktualizatora: $env:BUILD_VERSION.
          $highlights

          Pobierz **LockOn-ServiceOS-Setup.exe**.
          Instalator i pliki aktualizatora powstały w tym workflow i mają poświadczenie pochodzenia buildu w GitHub Artifact Attestations.

          Code signing policy:
          https://github.com/LokosPL/LockOn-Hub/blob/main/CODE_SIGNING.md

          Do czasu akceptacji projektu przez SignPath Foundation instalator może pozostawać niepodpisany.
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.product_version }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          gh release create "v$env:BUILD_VERSION" "release/LockOn-ServiceOS-Setup.exe" "release/LockOn-ServiceOS-Setup.exe.blockmap" "release/latest.yml" "release/SHA256SUMS.txt" --title "LockOn ServiceOS v$env:VERSION" --notes-file release-notes.md --latest

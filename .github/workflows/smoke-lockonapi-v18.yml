name: Smoke production lockonapi v18

on:
  push:
    branches: ["ops/deploy-lockonapi-v18"]
    paths:
      - ".github/workflows/smoke-lockonapi-v18.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 20 \
            'https://br-steep-bonus-b1f1qh8u-lockonapi.compute.c-5.eu-central-1.aws.neon.tech/health')"
          printf '%s' "$body" | jq -e '.ok == true and .service == "LockOn ServiceOS Central API"'
      - name: Verify protected business endpoints remain protected
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            '/me' \
            '/service/orders' \
            '/service/service-points'; do
            code="$(curl --silent --output /tmp/out.json --write-out '%{http_code}' --max-time 20 \
              "https://br-steep-bonus-b1f1qh8u-lockonapi.compute.c-5.eu-central-1.aws.neon.tech/${path#/}")"
            test "$code" = "401"
          done
          reset_code="$(curl --silent --output /tmp/reset.json --write-out '%{http_code}' --max-time 20 \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            'https://br-steep-bonus-b1f1qh8u-lockonapi.compute.c-5.eu-central-1.aws.neon.tech/admin/factory-reset')"
          test "$reset_code" = "401"

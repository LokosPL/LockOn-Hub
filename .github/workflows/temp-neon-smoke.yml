name: Temp Neon integration smoke

on:
  push:
    branches: ["feature/v0.21-service-finance-invoices", "feature/service-intake-card-refresh", "feature/service-intake-automation-*", "fix/service-card-*", "fix/user-frontdesk-flow-*", "release/**"]
    paths:
      - "functions/lockon-api.mjs"
      - "database/migrations/**"
      - ".github/workflows/temp-neon-smoke.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/neon-api-verify.yml"
      - ".github/workflows/central-api-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-neon-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: wandering-field-13057181
      NEON_BRANCH_ID: br-spring-pond-b1hqe48m
      NEON_FUNCTION_SLUG: lockonapi
      TEMP_API_URL: https://br-spring-pond-b1hqe48m-lockonapi.compute.c-5.eu-central-1.aws.neon.tech
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect temp Neon credential
        id: neon_credential
        shell: bash
        run: |
          if [ -n "$NEON_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Brak repo secret NEON_API_KEY. Bundle zostanie zbudowany i zachowany jako artefakt; deploy wykona podłączony Neon connector, a HTTP smoke może zweryfikować aktywną rewizję."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Build exact Neon bundle
        shell: bash
        run: |
          npm install --no-save --package-lock=false pg@8.16.3 google-auth-library@11.1.0 @aws-sdk/client-s3@3 @aws-sdk/s3-request-presigner@3 pdfmake@0.2.20 livekit-server-sdk@2.19.1 esbuild@0.25.12
          node --check functions/lockon-api.mjs
          mkdir -p central-api-dist
          npx esbuild functions/lockon-api.mjs \
            --bundle \
            --platform=node \
            --target=node24 \
            --format=esm \
            --banner:js="import{createRequire as ___cr}from'module';import{fileURLToPath as ___f}from'url';import{dirname as ___d}from'path';const require=___cr(import.meta.url);const __filename=___f(import.meta.url);const __dirname=___d(__filename);" \
            --outfile=central-api-dist/index.mjs
          zip -j temp-neon-lockonapi.zip central-api-dist/index.mjs
          sha256sum temp-neon-lockonapi.zip central-api-dist/index.mjs

      - name: Upload exact temp Neon bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: temp-neon-lockonapi
          path: temp-neon-lockonapi.zip
          if-no-files-found: error
          retention-days: 3

      - name: Publish exact bundle to temp GitHub branch for connector deploy
        if: steps.neon_credential.outputs.available != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_branch="tmp/v021-service-finance-smoke"
          base64 -w0 temp-neon-lockonapi.zip > bundle-full.b64
          split -b 180000 -d -a 2 bundle-full.b64 bundle-part-
          part_count=0
          for part_file in bundle-part-*; do
            suffix="$(printf '%02d' "$part_count")"
            target_path=".temp/temp-neon-lockonapi.part${suffix}"
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${target_path}?ref=${target_branch}" --jq '.sha' 2>/dev/null || true)"
            TARGET_BRANCH="$target_branch" TARGET_PATH="$target_path" CURRENT_SHA="$current_sha" PART_FILE="$part_file" node - <<'NODE'
          const fs=require('fs');
          const payload={
            message:'ci: stage exact temp Neon bundle part',
            content:fs.readFileSync(process.env.PART_FILE).toString('base64'),
            branch:process.env.TARGET_BRANCH
          };
          if(process.env.CURRENT_SHA) payload.sha=process.env.CURRENT_SHA;
          fs.writeFileSync('bundle-upload.json',JSON.stringify(payload));
          NODE
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${target_path}" --input bundle-upload.json >/dev/null
            part_count=$((part_count + 1))
          done

          bundle_sha="$(sha256sum temp-neon-lockonapi.zip | awk '{print $1}')"
          printf '{"partCount":%d,"chunkSize":180000,"sha256":"%s"}\n' "$part_count" "$bundle_sha" > bundle-manifest.json
          target_path=".temp/temp-neon-lockonapi.manifest.json"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${target_path}?ref=${target_branch}" --jq '.sha' 2>/dev/null || true)"
          TARGET_BRANCH="$target_branch" TARGET_PATH="$target_path" CURRENT_SHA="$current_sha" node - <<'NODE'
          const fs=require('fs');
          const payload={
            message:'ci: stage exact temp Neon bundle manifest',
            content:fs.readFileSync('bundle-manifest.json').toString('base64'),
            branch:process.env.TARGET_BRANCH
          };
          if(process.env.CURRENT_SHA) payload.sha=process.env.CURRENT_SHA;
          fs.writeFileSync('bundle-upload.json',JSON.stringify(payload));
          NODE
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${target_path}" --input bundle-upload.json >/dev/null

      - name: Deploy bundle to temp Neon only
        if: steps.neon_credential.outputs.available == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$NEON_BRANCH_ID/functions/$NEON_FUNCTION_SLUG/deployments"
          http="$(curl --silent --show-error --output deploy.json --write-out '%{http_code}' \
            --request POST "$endpoint" \
            --header "Authorization: Bearer $NEON_API_KEY" \
            --form "zip=@temp-neon-lockonapi.zip")"
          if [[ "$http" -lt 200 || "$http" -ge 300 ]]; then
            echo "::error::Temp Neon deploy HTTP $http"
            cat deploy.json
            exit 1
          fi
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('deploy.json','utf8'));
          const id=d.id ?? d.deployment?.id ?? d.deployment_id;
          if(id===undefined || id===null) throw new Error('Neon deploy response has no deployment id');
          console.log('deployment_id='+id);
          NODE

      - name: Wait for deployed revision
        if: steps.neon_credential.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$NEON_BRANCH_ID/functions/$NEON_FUNCTION_SLUG"
          expected="${{ steps.deploy.outputs.deployment_id }}"
          ready=0
          for attempt in $(seq 1 60); do
            curl --silent --show-error --fail "$endpoint" --header "Authorization: Bearer $NEON_API_KEY" > function.json
            state="$(node - <<'NODE'
          const fs=require('fs');
          const f=JSON.parse(fs.readFileSync('function.json','utf8'));
          const d=f.current_deployment ?? f.active_deployment ?? f.deployment ?? {};
          process.stdout.write(String(d.status ?? 'unknown'));
          NODE
          )"
            id="$(node - <<'NODE'
          const fs=require('fs');
          const f=JSON.parse(fs.readFileSync('function.json','utf8'));
          const d=f.current_deployment ?? f.active_deployment ?? f.deployment ?? {};
          process.stdout.write(String(d.id ?? ''));
          NODE
          )"
            if [[ "$id" == "$expected" && "$state" == "completed" ]]; then
              ready=1
              break
            fi
            if [[ "$id" == "$expected" && "$state" == "failed" ]]; then
              echo "::error::Temp Neon deployment $expected failed."
              exit 1
            fi
            sleep 5
          done
          if [[ "$ready" != "1" ]]; then
            echo "::error::Temp Neon deployment did not become active."
            exit 1
          fi

      - name: Temp health, CORS and authenticated smoke
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail "$TEMP_API_URL/health" > health.json
          node -e "const d=require('./health.json'); if(!d.ok) process.exit(1)"

          curl --silent --show-error --fail \
            --request OPTIONS "$TEMP_API_URL/service/orders" \
            --header "Origin: https://app.serviceos.pl" \
            --header "Access-Control-Request-Method: GET" \
            --header "Access-Control-Request-Headers: authorization,content-type" \
            --dump-header cors.headers --output /dev/null
          grep -iq '^access-control-allow-origin: https://app.serviceos.pl' cors.headers
          grep -iq '^access-control-allow-headers:.*authorization' cors.headers

          curl --silent --show-error --fail --request POST "$TEMP_API_URL/auth/dev-owner" > auth.json
          token="$(node -e "const d=require('./auth.json'); if(!d.token) process.exit(1); process.stdout.write(d.token)")"
          curl --silent --show-error --fail "$TEMP_API_URL/me" --header "Authorization: Bearer $token" > me.json
          node - <<'NODE'
          const d=require('./me.json');
          if(d.user?.role!=='OWNER') throw new Error('Temp dev login did not return OWNER');
          if(d.user?.name!=='System LockOn' || d.user?.email!==null || d.user?.picture!==null) throw new Error('OWNER private identity leaked from /me');
          if(!Array.isArray(d.points) || d.points.length<2) throw new Error('Temp owner needs at least two active points for logistics smoke');
          if(!d.activePointId || !d.points.some((p)=>p.id===d.activePointId)) throw new Error('Temp session has no server-bound active point');
          NODE

      - name: Temp role and authorization matrix
        shell: bash
        run: |
          set -euo pipefail

          expect_code() {
            local token="$1" path="$2" expected="$3" label="$4"
            local code
            code="$(curl --silent --show-error --output role-response.json --write-out '%{http_code}'               "$TEMP_API_URL$path"               --header "Authorization: Bearer $token")"
            if [[ "$code" != "$expected" ]]; then
              echo "::error::$label expected HTTP $expected, got $code"
              cat role-response.json || true
              exit 1
            fi
          }

          for role in OWNER BOSS COORDINATOR TECHNICIAN USER SUPPORT; do
            curl --silent --show-error --fail-with-body               --request POST "$TEMP_API_URL/auth/dev-role"               --header "Content-Type: application/json"               --data "$(node -e "process.stdout.write(JSON.stringify({role:process.argv[1]}))" "$role")" > "role-$role.json"
            token="$(node -e "const d=require('./role-'+process.argv[1]+'.json');if(!d.token||d.user?.role!==process.argv[1])throw new Error('Bad dev role login '+process.argv[1]);process.stdout.write(d.token)" "$role")"

            expect_code "$token" "/service/orders" "200" "$role service read"

            admin_expected="403"
            [[ "$role" == "OWNER" ]] && admin_expected="200"
            expect_code "$token" "/admin/overview" "$admin_expected" "$role admin"

            finance_expected="403"
            case "$role" in OWNER|BOSS|COORDINATOR|TECHNICIAN) finance_expected="200";; esac
            expect_code "$token" "/finance/revenues" "$finance_expected" "$role finance"

            workspace_expected="403"
            [[ "$role" == "TECHNICIAN" ]] && workspace_expected="200"
            expect_code "$token" "/service/technician-workspace" "$workspace_expected" "$role technician workspace"

            support_expected="403"
            case "$role" in OWNER|SUPPORT) support_expected="200";; esac
            expect_code "$token" "/support/tickets" "$support_expected" "$role support queue"

            customers_expected="403"
            case "$role" in OWNER|SUPPORT|USER) customers_expected="200";; esac
            expect_code "$token" "/customer-accounts" "$customers_expected" "$role customer workspace"
          done

          echo "Role matrix passed: OWNER, BOSS, COORDINATOR, TECHNICIAN, USER, SUPPORT."

      - name: Temp meetings permissions, signup and room gate
        shell: bash
        run: |
          set -euo pipefail

          owner_token="$(node -e "const d=require('./auth.json');process.stdout.write(d.token)")"
          user_token="$(node -e "const d=require('./role-USER.json');process.stdout.write(d.token)")"
          boss_token="$(node -e "const d=require('./role-BOSS.json');process.stdout.write(d.token)")"
          user_id="$(node -e "const d=require('./role-USER.json');process.stdout.write(d.user.id)")"

          api_code() {
            local token="$1" method="$2" path="$3" body="${4:-{}}"
            curl --silent --show-error --output meeting-response.json --write-out '%{http_code}'               --request "$method" "$TEMP_API_URL$path"               --header "Authorization: Bearer $token"               --header "Content-Type: application/json"               --data "$body"
          }

          # Only OWNER/BOSS can access planning options.
          [ "$(api_code "$owner_token" GET /meetings/options '{}')" = "200" ] || { cat meeting-response.json; exit 1; }
          [ "$(api_code "$boss_token" GET /meetings/options '{}')" = "200" ] || { cat meeting-response.json; exit 1; }
          [ "$(api_code "$user_token" GET /meetings/options '{}')" = "403" ] || { echo "::error::USER gained meeting planning options"; cat meeting-response.json; exit 1; }

          starts_at="$(node -e "process.stdout.write(new Date(Date.now()+3600000).toISOString())")"
          meeting_body="$(node - <<'NODE' "$starts_at" "$user_id"
          const [startsAt,userId]=process.argv.slice(2);
          process.stdout.write(JSON.stringify({
            title:'CI szkolenie 1.0.0.20',
            description:'TEMP E2E spotkań ServiceOS',
            startsAt,
            plannedMinutes:30,
            maxParticipants:4,
            allowParticipantAudio:false,
            allowParticipantScreenShare:false,
            audience:[{type:'USER',userId}]
          }));
          NODE
          )"

          # Ordinary USER must never create a meeting.
          user_create_http="$(api_code "$user_token" POST /meetings "$meeting_body")"
          [ "$user_create_http" = "403" ] || { echo "::error::USER created a meeting: HTTP $user_create_http"; cat meeting-response.json; exit 1; }

          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/meetings"             --header "Authorization: Bearer $owner_token"             --header "Content-Type: application/json"             --data "$meeting_body" > meeting-created.json
          meeting_id="$(node -e "const d=require('./meeting-created.json');if(!d.meeting?.id)throw new Error('Meeting create failed');process.stdout.write(d.meeting.id)")"

          rescheduled_at="$(node -e "process.stdout.write(new Date(Date.now()+7200000).toISOString())")"
          reschedule_body="$(node -e "process.stdout.write(JSON.stringify({startsAt:process.argv[1]}))" "$rescheduled_at")"
          user_reschedule_http="$(api_code "$user_token" PATCH "/meetings/$meeting_id" "$reschedule_body")"
          [ "$user_reschedule_http" = "403" ] || { echo "::error::USER could reschedule meeting: HTTP $user_reschedule_http"; cat meeting-response.json; exit 1; }
          curl --silent --show-error --fail-with-body --request PATCH "$TEMP_API_URL/meetings/$meeting_id" --header "Authorization: Bearer $owner_token" --header "Content-Type: application/json" --data "$reschedule_body" > meeting-rescheduled.json
          node - <<'NODE' "$rescheduled_at"
          const d=require('./meeting-rescheduled.json'), expected=process.argv[2];
          if(d.meeting?.startsAt!==expected)throw new Error('Meeting reschedule did not persist exact startsAt');
          if(!d.email||Number(d.email.eligible)<1||Number(d.email.queued)<1)throw new Error('Meeting reschedule did not queue a fresh invitation event');
          NODE

          curl --silent --show-error --fail-with-body "$TEMP_API_URL/meetings" --header "Authorization: Bearer $user_token" > user-meetings.json
          node - <<'NODE' "$meeting_id"
          const d=require('./user-meetings.json'), id=process.argv[2];
          const m=d.meetings?.find((item)=>item.id===id);
          if(!m)throw new Error('Eligible USER cannot see scheduled meeting');
          if(m.registeredByMe)throw new Error('USER unexpectedly registered before signup');
          NODE

          curl --silent --show-error --fail-with-body --request POST "$TEMP_API_URL/meetings/$meeting_id/register" --header "Authorization: Bearer $user_token" --header "Content-Type: application/json" --data '{}' > meeting-register.json
          node -e "const d=require('./meeting-register.json');if(!d.meeting?.registeredByMe)throw new Error('Meeting registration failed')"

          curl --silent --show-error --fail-with-body --request POST "$TEMP_API_URL/meetings/$meeting_id/unregister" --header "Authorization: Bearer $user_token" --header "Content-Type: application/json" --data '{}' > meeting-unregister.json
          node -e "const d=require('./meeting-unregister.json');if(d.meeting?.registeredByMe)throw new Error('Meeting unregister failed')"

          curl --silent --show-error --fail-with-body --request POST "$TEMP_API_URL/meetings/$meeting_id/register" --header "Authorization: Bearer $user_token" --header "Content-Type: application/json" --data '{}' > /dev/null

          user_start_http="$(api_code "$user_token" POST "/meetings/$meeting_id/start" '{}')"
          [ "$user_start_http" = "403" ] || { echo "::error::USER could start meeting: HTTP $user_start_http"; cat meeting-response.json; exit 1; }

          # This is an intentional production-readiness gate. It cannot pass until TEMP
          # has LIVEKIT_URL/API_KEY/API_SECRET configured on the exact deployed backend.
          curl --silent --show-error --fail-with-body --request POST "$TEMP_API_URL/meetings/$meeting_id/start" --header "Authorization: Bearer $owner_token" --header "Content-Type: application/json" --data '{}' > meeting-start.json
          node -e "const d=require('./meeting-start.json');if(d.meeting?.status!=='LIVE')throw new Error('Meeting did not enter LIVE')"

          curl --silent --show-error --fail-with-body --request POST "$TEMP_API_URL/meetings/$meeting_id/join-token" --header "Authorization: Bearer $user_token" --header "Content-Type: application/json" --data '{}' > user-join-token.json
          node - <<'NODE'
          const d=require('./user-join-token.json');
          if(!d.token||!d.serverUrl)throw new Error('Participant join token missing');
          if(d.canManage!==false)throw new Error('USER got host privileges');
          if(d.permissions?.microphone!==false||d.permissions?.screenShare!==false)throw new Error('Meeting publish restrictions were not enforced');
          NODE

          curl --silent --show-error --fail-with-body --request POST "$TEMP_API_URL/meetings/$meeting_id/join-token" --header "Authorization: Bearer $owner_token" --header "Content-Type: application/json" --data '{}' > host-join-token.json
          node - <<'NODE'
          const d=require('./host-join-token.json');
          if(!d.token||d.canManage!==true)throw new Error('Host join token/privileges missing');
          if(d.permissions?.microphone!==true||d.permissions?.screenShare!==true)throw new Error('Host publish permissions missing');
          NODE

          user_moderate_http="$(api_code "$user_token" POST "/meetings/$meeting_id/moderate" '{"identity":"forbidden","action":"MUTE"}')"
          [ "$user_moderate_http" = "403" ] || { echo "::error::USER gained moderation: HTTP $user_moderate_http"; cat meeting-response.json; exit 1; }

          curl --silent --show-error --fail-with-body --request POST "$TEMP_API_URL/meetings/$meeting_id/attendance" --header "Authorization: Bearer $user_token" --header "Content-Type: application/json" --data '{"action":"JOIN"}' > /dev/null
          sleep 1
          curl --silent --show-error --fail-with-body --request POST "$TEMP_API_URL/meetings/$meeting_id/attendance" --header "Authorization: Bearer $user_token" --header "Content-Type: application/json" --data '{"action":"LEAVE"}' > /dev/null
          curl --silent --show-error --fail-with-body "$TEMP_API_URL/meetings/$meeting_id/attendance" --header "Authorization: Bearer $owner_token" > meeting-attendance.json
          node - <<'NODE' "$user_id"
          const d=require('./meeting-attendance.json'), userId=process.argv[2];
          const item=d.attendance?.find((x)=>x.userId===userId);
          if(!item||!item.joined||!item.firstJoinedAt||!item.lastLeftAt||item.joinCount<1)throw new Error('Meeting attendance did not record join/leave');
          NODE

          curl --silent --show-error --fail-with-body --request POST "$TEMP_API_URL/meetings/$meeting_id/end" --header "Authorization: Bearer $owner_token" --header "Content-Type: application/json" --data '{}' > meeting-end.json
          node -e "const d=require('./meeting-end.json');if(d.meeting?.status!=='ENDED')throw new Error('Meeting did not enter ENDED')"

          echo "Meetings TEMP E2E passed: roles, visibility, reschedule mail event, register/unregister, host/participant grants, attendance, end."

      - name: Temp USER front-desk service E2E
        shell: bash
        run: |
          set -euo pipefail

          user_token="$(node -e "const d=require('./role-USER.json');process.stdout.write(d.token)")"
          user_id="$(node -e "const d=require('./role-USER.json');process.stdout.write(d.user.id)")"
          user_point="$(node -e "const d=require('./role-USER.json');process.stdout.write(d.activePointId||d.points?.[0]?.id||'')")"
          owner_token="$(node -e "const d=require('./auth.json');process.stdout.write(d.token)")"
          [ -n "$user_point" ]

          user_api() {
            local method="$1" path="$2" body="${3:-}"
            if [ -n "$body" ]; then
              curl --silent --show-error --fail-with-body --request "$method" "$TEMP_API_URL$path" --header "Authorization: Bearer $user_token" --header "Content-Type: application/json" --data "$body"
            else
              curl --silent --show-error --fail-with-body --request "$method" "$TEMP_API_URL$path" --header "Authorization: Bearer $user_token"
            fi
          }

          owner_api() {
            local method="$1" path="$2" body="${3:-}"
            if [ -n "$body" ]; then
              curl --silent --show-error --fail-with-body --request "$method" "$TEMP_API_URL$path" --header "Authorization: Bearer $owner_token" --header "Content-Type: application/json" --data "$body"
            else
              curl --silent --show-error --fail-with-body --request "$method" "$TEMP_API_URL$path" --header "Authorization: Bearer $owner_token"
            fi
          }

          user_api POST /me/active-point "$(node -e "process.stdout.write(JSON.stringify({pointId:process.argv[1]}))" "$user_point")" > user-active-point.json
          user_api GET /service/service-points > user-service-points.json
          destination="$(node - <<'NODE' "$user_point"
          const points=require('./user-service-points.json'), current=process.argv[2];
          const destination=points.find((p)=>p.id!==current && (p.effectiveAcceptsExternalRepairs||p.acceptsExternalRepairs||p.effectiveServiceEnabled||p.serviceEnabled));
          if(!destination) throw new Error('USER front-desk E2E needs a second service point');
          process.stdout.write(destination.id);
          NODE
          )"

          suffix="user-frontdesk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node - <<'NODE' "$suffix" > user-intake-body.json
          const suffix=process.argv[2];
          process.stdout.write(JSON.stringify({
            firstName:'CI',
            lastName:'USER '+suffix,
            email:suffix+'@invalid.test',
            phone:'+48123123123',
            brand:'LockOn',
            model:'USER FrontDesk',
            deviceNotes:'USER front-desk TEMP E2E',
            issueDescription:'Test przyjęcia telefonu przez rolę USER.',
            orderType:'REPAIR',
            estimatedCost:199.99
          }));
          NODE
          user_api POST /service/orders "$(cat user-intake-body.json)" > user-intake.json
          user_order_id="$(node -e "const d=require('./user-intake.json');if(!d.order?.id)throw new Error('USER intake failed');process.stdout.write(d.order.id)")"
          user_customer_id="$(node -e "const d=require('./user-intake.json');if(!d.customer?.id)throw new Error('USER intake customer missing');process.stdout.write(d.customer.id)")"
          node - <<'NODE' "$user_id"
          const d=require('./user-intake.json'), userId=process.argv[2];
          if(!d.notification?.queued)throw new Error('USER intake did not create the mandatory service notification');
          if(d.notification?.senderUserId!==userId){
            throw new Error('Service notification sender identity is not the employee who performed intake');
          }
          NODE

          user_api POST "/customer-accounts/$user_customer_id/notification-preferences" '{"serviceUpdates":false,"readyForPickup":true,"quoteUpdates":false,"messages":true}' > user-notification-prefs.json
          node - <<'NODE'
          const d=require('./user-notification-prefs.json');
          if(d.preferences?.serviceUpdates!==false||d.preferences?.readyForPickup!==true||d.preferences?.quoteUpdates!==false||d.preferences?.messages!==true){

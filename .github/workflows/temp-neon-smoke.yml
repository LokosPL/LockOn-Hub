name: Temporary Neon code-only smoke

on:
  push:
    paths:
      - ".github/workflows/temp-neon-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke temporary Neon function
        shell: bash
        env:
          BASE: https://br-rapid-mountain-b1lkmpt3-lockonapi.compute.c-5.eu-central-1.aws.neon.tech
        run: |
          set -euo pipefail

          health_body="$(mktemp)"
          health_code="$(curl --fail-with-body -sS -o "$health_body" -w '%{http_code}' "$BASE/health")"
          test "$health_code" = "200"
          grep -q '"ok":true' "$health_body"

          web_body="$(mktemp)"
          web_code="$(curl -sS -o "$web_body" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://app.serviceos.pl' \
            --data '{"idToken":"not-a-real-token"}' \
            "$BASE/auth/google-web")"
          test "$web_code" = "404"
          grep -q '"error":"WEB_CODE_ONLY"' "$web_body"

          redeem_body="$(mktemp)"
          redeem_code="$(curl -sS -o "$redeem_body" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://app.serviceos.pl' \
            --data '{"code":"BAD"}' \
            "$BASE/website/redeem")"
          test "$redeem_code" = "400"
          grep -q '"error":"CODE"' "$redeem_body"

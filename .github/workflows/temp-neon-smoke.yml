          if(order.currentPointId!==destination)throw new Error('USER order current location was not updated to service point');
          if(!order.latestTransfer||order.latestTransfer.status!=='ACCEPTED')throw new Error('USER cannot see latest accepted transfer timing');
          NODE

          user_api GET "/service/orders/$user_order_id/history" > user-away-history.json
          node -e "const h=require('./user-away-history.json');if(!Array.isArray(h)||!h.length)throw new Error('Home-point USER lost service history while phone is away')"

          user_api GET /customer-accounts > user-customers.json
          node - <<'NODE' "$user_customer_id"
          const d=require('./user-customers.json'), customerId=process.argv[2];
          const customer=d.customers?.find((item)=>item.id===customerId);
          if(!customer)throw new Error('Home-point USER lost their customer while phone is away');
          if(customer.activeSessions!==0||customer.googleLinked!==false||customer.googleEmail!==null||customer.blocked!==false)throw new Error('Front-desk customer API leaked portal administration metadata');
          NODE

          user_api GET "/service/customers/$user_customer_id" > user-customer-detail.json
          node - <<'NODE' "$user_order_id"
          const d=require('./user-customer-detail.json'), orderId=process.argv[2];
          if(!d.orders?.some((item)=>item.id===orderId))throw new Error('Front-desk customer card does not include away service order');
          NODE

          user_api POST "/customer-accounts/$user_customer_id/profile" "$(node -e "process.stdout.write(JSON.stringify({firstName:'CI',lastName:process.argv[1],email:process.argv[2]+'@invalid.test',phone:'+48999111222'}))" "USER $suffix" "$suffix")" > user-customer-profile.json
          node -e "const d=require('./user-customer-profile.json');if(d.customer?.phone!=='+48999111222')throw new Error('USER could not update customer contact data')"

          set +e
          away_edit_http="$(curl --silent --show-error --output user-away-edit.json --write-out '%{http_code}' --request POST "$TEMP_API_URL/service/orders/$user_order_id/details" --header "Authorization: Bearer $user_token" --header "Content-Type: application/json" --data '{"deviceNotes":"Nie wolno edytować telefonu w obcym punkcie"}')"
          set -e
          [ "$away_edit_http" = "403" ] || { echo "::error::Home-point USER gained technical write access to away phone: HTTP $away_edit_http"; cat user-away-edit.json; exit 1; }

          # Continue the original incoming-transfer USER scenarios.
          owner_api POST /me/active-point "$(node -e "process.stdout.write(JSON.stringify({pointId:process.argv[1]}))" "$destination")" > owner-user-destination.json
          node - <<'NODE' "$suffix" > user-incoming-body.json
          const suffix=process.argv[2];
          process.stdout.write(JSON.stringify({
            firstName:'CI',
            lastName:'INCOMING '+suffix,
            email:'incoming-'+suffix+'@invalid.test',
            phone:'+48123123124',
            brand:'LockOn',
            model:'Incoming USER',
            deviceNotes:'Incoming transfer for USER TEMP E2E',
            issueDescription:'Test ręcznego przyjęcia przekazania przez USER.',
            orderType:'REPAIR',
            estimatedCost:179.99
          }));
          NODE
          owner_api POST /service/orders "$(cat user-incoming-body.json)" > user-incoming-order.json
          incoming_order_id="$(node -e "const d=require('./user-incoming-order.json');process.stdout.write(d.order.id)")"
          owner_api POST "/service/orders/$incoming_order_id/transfer" "$(node -e "process.stdout.write(JSON.stringify({kind:'OUTBOUND_SERVICE',toPointId:process.argv[1],note:'Incoming to USER point'}))" "$user_point")" > user-incoming-transfer.json
          incoming_transfer_id="$(node -e "const d=require('./user-incoming-transfer.json');process.stdout.write(d.transfer.id)")"

          user_api POST "/service/transfers/$incoming_transfer_id/status" '{"status":"DELIVERED","note":"USER potwierdza dostarczenie"}' > user-delivered.json
          user_api POST "/service/transfers/$incoming_transfer_id/status" '{"status":"ACCEPTED","note":"USER przyjął telefon"}' > user-accepted.json
          node -e "const d=require('./user-accepted.json');if(d.transfer?.status!=='ACCEPTED')throw new Error('USER manual transfer acceptance failed')"

          owner_api POST /me/active-point "$(node -e "process.stdout.write(JSON.stringify({pointId:process.argv[1]}))" "$destination")" > /dev/null
          node - <<'NODE' "$suffix" > user-scan-body.json
          const suffix=process.argv[2];
          process.stdout.write(JSON.stringify({
            firstName:'CI',
            lastName:'SCAN '+suffix,
            email:'scan-'+suffix+'@invalid.test',
            phone:'+48123123125',
            brand:'LockOn',
            model:'Scan USER',
            deviceNotes:'Scan acceptance for USER TEMP E2E',
            issueDescription:'Test przyjęcia skanem przez USER.',
            orderType:'REPAIR',
            estimatedCost:189.99
          }));
          NODE
          owner_api POST /service/orders "$(cat user-scan-body.json)" > user-scan-order.json
          scan_order_id="$(node -e "const d=require('./user-scan-order.json');process.stdout.write(d.order.id)")"
          owner_api POST "/service/orders/$scan_order_id/service-card" '{"printMode":"ONLINE_ONLY"}' > user-scan-card.json
          scan_code="$(node -e "const d=require('./user-scan-card.json');if(!d.staffScanCode)throw new Error('Missing scan code');process.stdout.write(d.staffScanCode)")"
          owner_api POST "/service/orders/$scan_order_id/transfer" "$(node -e "process.stdout.write(JSON.stringify({kind:'OUTBOUND_SERVICE',toPointId:process.argv[1],note:'Scan incoming to USER'}))" "$user_point")" > user-scan-transfer.json
          user_api POST /service/scan "$(node -e "process.stdout.write(JSON.stringify({code:process.argv[1]}))" "$scan_code")" > user-scan-accepted.json
          node -e "const d=require('./user-scan-accepted.json');if(d.scanAction!=='SERVICE_ACCEPTED')throw new Error('USER scan acceptance failed')"

          owner_api POST /me/active-point "$(node -e "process.stdout.write(JSON.stringify({pointId:process.argv[1]}))" "$user_point")" > /dev/null
          node - <<'NODE' "$suffix" > user-pickup-body.json
          const suffix=process.argv[2];
          process.stdout.write(JSON.stringify({
            firstName:'CI',
            lastName:'PICKUP '+suffix,
            email:'pickup-'+suffix+'@invalid.test',
            phone:'+48123123126',
            brand:'LockOn',
            model:'Pickup USER',
            deviceNotes:'Pickup by USER TEMP E2E',
            issueDescription:'Test wydania telefonu klientowi przez USER.',
            orderType:'REPAIR',
            estimatedCost:209.99
          }));
          NODE
          owner_api POST /service/orders "$(cat user-pickup-body.json)" > user-pickup-order.json
          pickup_order_id="$(node -e "const d=require('./user-pickup-order.json');process.stdout.write(d.order.id)")"
          owner_api POST "/service/orders/$pickup_order_id/status" '{"status":"DIAGNOSIS","note":"CI USER pickup"}' > /dev/null
          owner_api POST "/service/orders/$pickup_order_id/status" '{"status":"IN_REPAIR","note":"CI USER pickup"}' > /dev/null
          owner_api POST "/service/orders/$pickup_order_id/status" '{"status":"REPAIR_DONE","note":"CI USER pickup"}' > /dev/null
          owner_api POST "/service/orders/$pickup_order_id/warranty" '{"months":3,"repairSummary":"Naprawa testowa USER front-desk"}' > /dev/null
          owner_api POST "/service/orders/$pickup_order_id/warranty-card" '{}' > /dev/null
          owner_api POST "/service/orders/$pickup_order_id/status" '{"status":"READY","note":"Gotowe do wydania przez USER"}' > user-pickup-ready.json
          user_api POST "/service/orders/$pickup_order_id/status" '{"status":"COMPLETED","note":"Wydano klientowi przez USER"}' > user-pickup-completed.json
          node -e "const d=require('./user-pickup-completed.json');if(d.order?.status!=='COMPLETED')throw new Error('USER pickup completion failed')"

          echo "USER front-desk E2E passed: intake, customer view/update, home-point tracking, outbound, manual accept, scan accept, pickup."

      - name: Temp service intake, PDF and logistics E2E
        shell: bash
        run: |
          set -euo pipefail

          token="$(node -e "const d=require('./auth.json'); process.stdout.write(d.token)")"
          node - <<'NODE' > e2e-env.sh
          const d=require('./me.json');
          const home=d.points.find((p)=>p.id===d.activePointId);
          const other=d.points.find((p)=>p.id!==d.activePointId);
          if(!home||!other)throw new Error('Need two points');
          const q=(v)=>"'" + String(v).replace(/'/g,"'\\''") + "'";
          console.log('ORIGINAL_POINT='+q(home.id));
          console.log('OTHER_POINT='+q(other.id));
          NODE
          . ./e2e-env.sh

          api() {
            local method="$1" path="$2" body="${3:-}"
            if [ -n "$body" ]; then
              curl --silent --show-error --fail-with-body                 --request "$method" "$TEMP_API_URL$path"                 --header "Authorization: Bearer $token"                 --header "Content-Type: application/json"                 --data "$body"
            else
              curl --silent --show-error --fail-with-body                 --request "$method" "$TEMP_API_URL$path"                 --header "Authorization: Bearer $token"
            fi
          }

          api POST /me/active-point "$(node -e "process.stdout.write(JSON.stringify({pointId:process.argv[1]}))" "$OTHER_POINT")" > active-other.json
          node -e "const d=require('./active-other.json');if(d.activePointId!==process.argv[1])throw new Error('Active point switch failed')" "$OTHER_POINT"

          run_suffix="${GITHUB_RUN_ID:-0}${GITHUB_RUN_ATTEMPT:-0}"
          intake="$(node - <<'NODE' "$ORIGINAL_POINT" "$run_suffix"
          const [wrongPoint,suffix]=process.argv.slice(2);
          process.stdout.write(JSON.stringify({
            pointId:wrongPoint,
            firstName:'CI',
            lastName:'Smoke '+suffix,
            email:'serviceos-ci-'+suffix+'@invalid.test',
            phone:'+48123456789',
            issueDescription:'Automatyczny test intake bez marki, modelu, uwag, IMEI i numeru seryjnego.',
            orderType:'REPAIR'
          }));
          NODE
          )"
          api POST /service/orders "$intake" > intake.json
          node - <<'NODE' "$OTHER_POINT"
          const d=require('./intake.json');
          const expected=process.argv[2];
          if(!d.order?.id)throw new Error('Order was not created');
          if(d.order.pointId!==expected)throw new Error('Backend trusted spoofed pointId instead of session active point');
          if(d.order.handlingMode!=='STANDARD')throw new Error('Repair did not derive STANDARD handling mode');
          if(d.order.assignedTechnicianId!==null)throw new Error('OWNER intake unexpectedly assigned a technician');
          if(d.serviceCard?.required!==true)throw new Error('Service card choice is not required');
          if(d.notification?.queued!==true)throw new Error('Mandatory intake email was not queued');
          NODE

          order_id="$(node -e "const d=require('./intake.json');process.stdout.write(d.order.id)")"
          api GET /service/orders > orders-after-intake.json
          node - <<'NODE' "$order_id"
          const orders=require('./orders-after-intake.json');
          const order=orders.find((item)=>item.id===process.argv[2]);
          if(!order)throw new Error('Created order missing from list');
          if(order.brand!=='Nie podano'||order.model!=='Nie podano')throw new Error('Optional brand/model fallback is missing');
          if(order.deviceNotes!=='Brak uwag')throw new Error('Automatic no-notes fallback is missing');
          if(!order.estimatedCompletionAt)throw new Error('Automatic +3 day ETA is missing');
          const delta=new Date(order.estimatedCompletionAt).getTime()-Date.now();
          if(delta<2.5*24*60*60*1000||delta>3.1*24*60*60*1000)throw new Error('Automatic ETA is not approximately 3 days');
          NODE
          owner_id="$(node -e "const d=require('./me.json');process.stdout.write(d.user.id)")"

          note_marker="OWNER-NOTE-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          api POST "/service/orders/$order_id/notes" "$(node -e "process.stdout.write(JSON.stringify({body:process.argv[1]}))" "$note_marker")" > owner-note-create.json
          node - <<'NODE' "$owner_id" "$note_marker"
          const d=require('./owner-note-create.json');
          const [ownerId,marker]=process.argv.slice(2);
          if(d.authorUserId!==ownerId || d.authorName!=='System LockOn' || d.body!==marker) throw new Error('OWNER note create response leaked identity');
          NODE

          api GET "/service/orders/$order_id/notes" > owner-notes.json
          node - <<'NODE' "$owner_id" "$note_marker"
          const notes=require('./owner-notes.json');
          const [ownerId,marker]=process.argv.slice(2);
          const note=notes.find(x=>x.authorUserId===ownerId&&x.body===marker);
          if(!note || note.authorName!=='System LockOn') throw new Error('OWNER note history is not anonymized');
          NODE

          api GET "/service/orders/$order_id/history" > owner-history.json
          node - <<'NODE' "$owner_id"
          const history=require('./owner-history.json'), ownerId=process.argv[2];
          const own=history.filter(x=>x.changedByUserId===ownerId);
          if(!own.length) throw new Error('OWNER status history fixture missing');
          if(own.some(x=>x.changedByName!=='System LockOn')) throw new Error('OWNER status history leaked identity');
          NODE

          api GET "/service/technicians?pointId=$OTHER_POINT" > owner-technicians.json
          node - <<'NODE' "$owner_id" "$OTHER_POINT"
          const technicians=require('./owner-technicians.json'), me=require('./me.json');
          const [ownerId,pointId]=process.argv.slice(2);
          if(technicians.some(x=>x.id===ownerId)) throw new Error('OWNER appeared in technician selector');
          const point=me.points.find(x=>x.id===pointId);
          if(!point) throw new Error('Point missing from owner profile');
          if(Number(point.activeTechnicianCount)!==technicians.length) throw new Error('OWNER or non-technician affects active technician count');
          NODE

          api POST "/service/orders/$order_id/service-card" '{"printMode":"PHYSICAL_AND_ONLINE"}' > card.json
          node - <<'NODE'
          const fs=require('fs');
          const d=require('./card.json');
          if(!/^SV-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(d.staffScanCode||''))throw new Error('Manual staff scan code missing');
          const pdf=Buffer.from(d.pdfBase64||'','base64');
          if(pdf.subarray(0,5).toString()!=='%PDF-')throw new Error('Generated card is not a real PDF');
          if(pdf.length<10000)throw new Error('Generated card PDF is unexpectedly small');
          fs.writeFileSync('service-card.pdf',pdf);
          fs.writeFileSync('staff-scan-code.txt',d.staffScanCode);
          NODE

          command -v pdfinfo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
          pdfinfo service-card.pdf > pdfinfo.txt
          cat pdfinfo.txt
          grep -q '^Pages:[[:space:]]*1' pdfinfo.txt || { echo "::error::Service card is not exactly one page"; exit 1; }
          grep -Eq '^Page size:[[:space:]]+84[01](\.[0-9]+)? x 59[45](\.[0-9]+)? pts' pdfinfo.txt || { echo "::error::Service card is not A4 landscape"; exit 1; }
          pdftotext -layout service-card.pdf service-card.txt
          echo "--- extracted service card text ---"
          cat service-card.txt
          grep -qi 'PRZETNIJ' service-card.txt || { echo "::error::Cut-line label is missing from rendered PDF text"; exit 1; }
          grep -qi 'LockOn' service-card.txt || { echo "::error::LockOn branding is missing from rendered PDF text"; exit 1; }
          grep -Fqi 'Karta urządzenia' service-card.txt || { echo "::error::Physical PDF lost the device-card half"; exit 1; }
          grep -Fqi 'Karta serwisowa' service-card.txt || { echo "::error::Physical PDF lost the customer-card half"; exit 1; }
          grep -Fqi 'Zeskanuj kod QR w ServiceOS' service-card.txt || { echo "::error::Device QR purpose text is missing from rendered PDF"; exit 1; }
          grep -Fqi 'Kod ręczny' service-card.txt || { echo "::error::Manual scan-code explanation is missing from rendered PDF"; exit 1; }
          grep -Eq '[0-9]{2}\.[0-9]{2}\.[0-9]{4}[^0-9]+[0-9]{2}:[0-9]{2}' service-card.txt || { echo "::error::Physical service card is missing intake time"; exit 1; }

          customer_id="$(node -e "const d=require('./intake.json');process.stdout.write(d.customer.id)")"
          api POST "/customer-accounts/$customer_id/code" '{"rotate":false}' > customer-code.json
          customer_code="$(node -e "const d=require('./customer-code.json');if(!d.code)throw new Error('Customer portal code missing');process.stdout.write(d.code)")"
          curl --silent --show-error --fail-with-body \
            --request POST "$TEMP_API_URL/public/customer-portal/login" \
            --header "Content-Type: application/json" \
            --data "$(node -e "process.stdout.write(JSON.stringify({code:process.argv[1]}))" "$customer_code")" > customer-login.json
          customer_token="$(node -e "const d=require('./customer-login.json');if(!d.sessionToken)throw new Error('Customer portal login failed');process.stdout.write(d.sessionToken)")"
          curl --silent --show-error --fail-with-body \
            "$TEMP_API_URL/public/customer-portal/orders/$order_id/service-card" \
            --header "Authorization: Bearer $customer_token" > customer-card.json
          node - <<'NODE'
          const fs=require('fs');
          const d=require('./customer-card.json');
          const pdf=Buffer.from(d.pdfBase64||'','base64');
          if(pdf.subarray(0,5).toString()!=='%PDF-')throw new Error('Customer service card is not a real PDF');
          if(pdf.length<10000)throw new Error('Customer service card PDF is unexpectedly small');
          fs.writeFileSync('customer-card.pdf',pdf);
          NODE
          pdfinfo customer-card.pdf > customer-card-pdfinfo.txt
          cat customer-card-pdfinfo.txt
          grep -q '^Pages:[[:space:]]*1' customer-card-pdfinfo.txt || { echo "::error::Customer card is not exactly one page"; exit 1; }
          grep -Eq '^Page size:[[:space:]]+59[45](\.[0-9]+)? x 84[12](\.[0-9]+)? pts' customer-card-pdfinfo.txt || { echo "::error::Customer card is not full A4 portrait"; exit 1; }
          pdftotext -layout customer-card.pdf customer-card.txt
          echo "--- extracted customer card text ---"
          cat customer-card.txt
          grep -Fqi 'Panel klienta' customer-card.txt || { echo "::error::Customer panel section missing from PDF"; exit 1; }
          grep -Fqi 'Kod klienta' customer-card.txt || { echo "::error::Customer code missing from PDF"; exit 1; }
          grep -Fqi 'Cena orientacyjna' customer-card.txt || { echo "::error::Estimated price missing from customer PDF"; exit 1; }
          grep -Fqi 'Przyjęcie i urządzenie' customer-card.txt || { echo "::error::Customer intake section missing from PDF"; exit 1; }
          grep -Fqi 'Obsługa serwisowa' customer-card.txt || { echo "::error::Customer service section missing from PDF"; exit 1; }
          grep -Eq '[0-9]{2}\.[0-9]{2}\.[0-9]{4}[^0-9]+[0-9]{2}:[0-9]{2}' customer-card.txt || { echo "::error::Customer card is missing intake time"; exit 1; }
          grep -Fqi 'Warunki przyjęcia i odbioru' customer-card.txt || { echo "::error::Terms missing from customer PDF"; exit 1; }
          grep -Fqi 'nie oznacza porzucenia' customer-card.txt || { echo "::error::Safe 90-day collection wording missing from customer PDF"; exit 1; }
          grep -Fqi 'szkody będące następstwem' customer-card.txt || { echo "::error::Data-loss consequential-damage notice missing from customer PDF"; exit 1; }
          grep -Eq 'KS-[0-9]{4}-[0-9]{6}' customer-card.txt || { echo "::error::Service card number missing from customer PDF"; exit 1; }
          if grep -Fqi 'PRZETNIJ TUTAJ' customer-card.txt; then echo "::error::Customer-only PDF reused the physical two-card cut layout"; exit 1; fi

          staff_code="$(cat staff-scan-code.txt)"
          api POST /me/active-point "$(node -e "process.stdout.write(JSON.stringify({pointId:process.argv[1]}))" "$ORIGINAL_POINT")" > active-original.json

          set +e
          wrong_scan_http="$(curl --silent --show-error --output wrong-scan.json --write-out '%{http_code}'             --request POST "$TEMP_API_URL/service/scan"             --header "Authorization: Bearer $token"             --header "Content-Type: application/json"             --data "$(node -e "process.stdout.write(JSON.stringify({actingPointId:process.argv[1],code:process.argv[2]}))" "$OTHER_POINT" "$staff_code")")"
          set -e
          [ "$wrong_scan_http" = "409" ]
          node -e "const d=require('./wrong-scan.json');if(d.error!=='TRANSFER_REQUIRED')throw new Error('Wrong-point scan was not rejected by server-bound active point')"

          api POST /me/active-point "$(node -e "process.stdout.write(JSON.stringify({pointId:process.argv[1]}))" "$OTHER_POINT")" > /dev/null
          api POST "/service/orders/$order_id/transfer" "$(node -e "process.stdout.write(JSON.stringify({kind:'OUTBOUND_SERVICE',toPointId:process.argv[1],note:'CI temp smoke'}))" "$ORIGINAL_POINT")" > outbound.json

          api POST /me/active-point "$(node -e "process.stdout.write(JSON.stringify({pointId:process.argv[1]}))" "$ORIGINAL_POINT")" > /dev/null
          api POST /service/scan "$(node -e "process.stdout.write(JSON.stringify({code:process.argv[1]}))" "$staff_code")" > scan-outbound.json
          node -e "const d=require('./scan-outbound.json');if(d.scanAction!=='SERVICE_ACCEPTED')throw new Error('Outbound transfer was not accepted by scan')"

          api POST "/service/orders/$order_id/status" '{"status":"REPAIR_DONE","note":"CI temp smoke"}' > repair-done.json
          node -e "const d=require('./repair-done.json');if(d.order?.status!=='REPAIR_DONE')throw new Error('Could not mark repair done at service point')"

          api POST "/service/orders/$order_id/transfer" '{"kind":"RETURN_HOME","note":"CI temp smoke return before warranty"}' > return-home.json
          api POST /me/active-point "$(node -e "process.stdout.write(JSON.stringify({pointId:process.argv[1]}))" "$OTHER_POINT")" > /dev/null
          api POST /service/scan "$(node -e "process.stdout.write(JSON.stringify({code:process.argv[1]}))" "$staff_code")" > scan-return-before-warranty.json
          node - <<'NODE'
          const d=require('./scan-return-before-warranty.json');
          if(d.scanAction!=='RETURN_ACCEPTED_WARRANTY_REQUIRED')throw new Error('Return-home scan did not keep REPAIR_DONE pending warranty');
          if(d.order?.status!=='REPAIR_DONE')throw new Error('Returned repaired order changed status before warranty');
          NODE

          set +e
          ready_without_warranty_http="$(curl --silent --show-error --output ready-without-warranty.json --write-out '%{http_code}'             --request POST "$TEMP_API_URL/service/orders/$order_id/status"             --header "Authorization: Bearer $token"             --header "Content-Type: application/json"             --data '{"status":"READY","note":"CI must be blocked before warranty"}')"
          set -e
          [ "$ready_without_warranty_http" = "409" ] || { echo "::error::READY was not blocked before warranty: HTTP $ready_without_warranty_http"; cat ready-without-warranty.json; exit 1; }
          node -e "const d=require('./ready-without-warranty.json');if(d.error!=='WARRANTY_REQUIRED')throw new Error('READY rejection did not use WARRANTY_REQUIRED: '+JSON.stringify(d))"

          api POST "/service/orders/$order_id/warranty" '{"months":6,"repairSummary":"Wymiana modułu wyświetlacza i test funkcjonalny CI"}' > warranty.json
          node - <<'NODE'
          const d=require('./warranty.json');
          if(d.warranty?.months!==6)throw new Error('Warranty months were not saved');
          if(!d.warranty?.startedAt||!d.warranty?.expiresAt)throw new Error('Warranty dates were not created');
          if(d.warranty?.repairSummary!=='Wymiana modułu wyświetlacza i test funkcjonalny CI')throw new Error('Repair summary was not saved with warranty');
          if(!d.warranty?.warrantyCardNumber?.startsWith('GW-'))throw new Error('Warranty card number missing');
          if(d.order?.warrantyReady!==false)throw new Error('Warranty must not be ready before card print');
          NODE

          api POST "/service/orders/$order_id/warranty-card" '{}' > warranty-card.json
          node - <<'NODE'
          const fs=require('fs');
          const d=require('./warranty-card.json');
          if(d.order?.warrantyReady!==true)throw new Error('Warranty was not unlocked after card print');
          const pdf=Buffer.from(d.pdfBase64||'','base64');
          if(pdf.subarray(0,5).toString()!=='%PDF-')throw new Error('Warranty card is not a PDF');
          if(pdf.length<7000)throw new Error('Warranty card PDF is unexpectedly small');
          fs.writeFileSync('warranty-card.pdf',pdf);
          NODE
          pdfinfo warranty-card.pdf > warranty-card-pdfinfo.txt
          grep -q '^Pages:[[:space:]]*1' warranty-card-pdfinfo.txt || { echo "::error::Warranty card is not exactly one page"; exit 1; }
          pdftotext -layout warranty-card.pdf warranty-card.txt
          grep -Fqi 'Karta gwarancyjna naprawy' warranty-card.txt || { echo "::error::Warranty title missing from PDF"; exit 1; }
          grep -Fqi 'Kod klienta' warranty-card.txt || { echo "::error::Customer code missing from warranty PDF"; exit 1; }
          grep -Fqi '6 mies.' warranty-card.txt || { echo "::error::Warranty duration missing from PDF"; exit 1; }
          grep -Fqi 'Wykonana naprawa' warranty-card.txt || { echo "::error::Performed repair heading missing from warranty PDF"; exit 1; }
          grep -Fqi 'Wymiana modułu wyświetlacza' warranty-card.txt || { echo "::error::Performed repair content missing from warranty PDF"; exit 1; }
          grep -Eq 'GW-[0-9]{4}-[0-9]{6}' warranty-card.txt || { echo "::error::Warranty card number missing from PDF"; exit 1; }

          curl --silent --show-error --fail-with-body             "$TEMP_API_URL/public/customer-portal/me"             --header "Authorization: Bearer $customer_token" > customer-warranty.json
          node - <<'NODE' "$order_id"
          const d=require('./customer-warranty.json'), orderId=process.argv[2];
          const order=d.orders?.find((item)=>item.id===orderId);
          if(!order?.warranty||order.warranty.months!==6||!order.warranty.expiresAt)throw new Error('Customer portal does not expose warranty');
          if(order.warranty.status!=='ACTIVE'||order.warranty.active!==true||order.warranty.daysRemaining<1)throw new Error('Customer warranty status is not active');
          if(order.warranty.cardAvailable!==true||!order.warranty.cardNumber?.startsWith('GW-'))throw new Error('Customer warranty card metadata missing');
          if(!order.warranty.repairSummary?.includes('Wymiana modułu'))throw new Error('Customer warranty repair summary missing');
          NODE

          curl --silent --show-error --fail-with-body             "$TEMP_API_URL/public/customer-portal/orders/$order_id/warranty-card"             --header "Authorization: Bearer $customer_token" > customer-warranty-card.json
          node - <<'NODE'
          const fs=require('fs');
          const d=require('./customer-warranty-card.json');
          const pdf=Buffer.from(d.pdfBase64||'','base64');
          if(pdf.subarray(0,5).toString()!=='%PDF-')throw new Error('Customer warranty card download is not a PDF');
          if(!d.warrantyCardNumber?.startsWith('GW-'))throw new Error('Customer warranty card number missing');
          fs.writeFileSync('customer-warranty-card.pdf',pdf);
          NODE

          api POST "/service/orders/$order_id/status" '{"status":"READY","note":"CI warranty gate passed"}' > ready-after-warranty.json
          node -e "const d=require('./ready-after-warranty.json');if(d.order?.status!=='READY')throw new Error('READY did not succeed after warranty card generation')"

          api POST /me/active-point "$(node -e "process.stdout.write(JSON.stringify({pointId:process.argv[1]}))" "$ORIGINAL_POINT")" > /dev/null

          api GET "/service/orders?limit=1&offset=0" > orders-page-one.json
          node -e "const d=require('./orders-page-one.json');if(!Array.isArray(d)||d.length>1)throw new Error('Service orders pagination limit failed')"

          api GET /service/orders > owner-orders-after-transfer.json
          node - <<'NODE' "$owner_id" "$order_id"
          const orders=require('./owner-orders-after-transfer.json');
          const [ownerId,orderId]=process.argv.slice(2);
          const order=orders.find(x=>x.id===orderId);
          if(!order) throw new Error('OWNER transfer regression order missing');
          const transfers=order.transfers||[];
          const sent=transfers.filter(x=>x.sentByUserId===ownerId);
          const accepted=transfers.filter(x=>x.acceptedByUserId===ownerId);
          if(!sent.length || !accepted.length) throw new Error('OWNER transfer actor fixtures missing');
          if(sent.some(x=>x.sentByName!=='System LockOn') || accepted.some(x=>x.acceptedByName!=='System LockOn')) throw new Error('OWNER transfer identity leaked');
          NODE


      - name: Temp complaint flow E2E
        shell: bash
        run: |
          set -euo pipefail
          token="$(node -e "const d=require('./auth.json');process.stdout.write(d.token)")"
          point_id="$(node -e "const d=require('./me.json');process.stdout.write(d.points[0].id)")"

          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/me/active-point"             --header "Authorization: Bearer $token"             --header "Content-Type: application/json"             --data "$(node -e "process.stdout.write(JSON.stringify({pointId:process.argv[1]}))" "$point_id")" > complaint-point.json

          suffix="cmp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          imei="$(printf '870000%09d' "$((GITHUB_RUN_ID % 1000000000))")"
          imei="${imei:0:15}"

          node - <<'NODE' "$suffix" "$imei" > complaint-original-body.json
          const [suffix,imei]=process.argv.slice(2);
          process.stdout.write(JSON.stringify({
            firstName:'CI',
            lastName:'Reklamacja '+suffix,
            email:'complaint-'+suffix+'@invalid.test',
            phone:'+48111222333',
            brand:'LockOn',
            model:'Complaint E2E',
            imei,
            serialNumber:'CMP-'+suffix,
            deviceNotes:'Urządzenie bazowe reklamacji TEMP E2E.',
            issueDescription:'Naprawa bazowa TEMP przed reklamacją.',
            orderType:'REPAIR'
          }));
          NODE
          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/service/orders"             --header "Authorization: Bearer $token"             --header "Content-Type: application/json"             --data @complaint-original-body.json > complaint-original.json
          original_id="$(node -e "const d=require('./complaint-original.json');if(!d.order?.id)throw new Error('Original repair missing');process.stdout.write(d.order.id)")"
          original_number="$(node -e "const d=require('./complaint-original.json');process.stdout.write(String(d.order.orderNumber||''))")"

          curl --silent --show-error --fail-with-body             "$TEMP_API_URL/service/orders/search?q=$(node -p "encodeURIComponent(process.argv[1])" "$original_number")"             --header "Authorization: Bearer $token" > complaint-search.json
          node - <<'NODE' "$original_id"
          const rows=require('./complaint-search.json'), originalId=process.argv[2];
          if(!rows.some(x=>x.id===originalId)) throw new Error('Order search did not find original repair');
          NODE

          node - <<'NODE' "$suffix" "$imei" "$original_id" > complaint-body.json
          const [suffix,imei,originalOrderId]=process.argv.slice(2);
          process.stdout.write(JSON.stringify({
            firstName:'CI',
            lastName:'Reklamacja '+suffix,
            email:'complaint-'+suffix+'@invalid.test',
            phone:'+48111222333',
            brand:'LockOn',
            model:'Complaint E2E',
            imei,
            serialNumber:'CMP-'+suffix,
            deviceNotes:'Syntetyczna reklamacja TEMP E2E.',
            issueDescription:'Reklamacja TEMP: weryfikacja trybu COMPLAINT_FLOW.',
            orderType:'COMPLAINT',
            originalOrderId
          }));
          NODE

          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/service/orders"             --header "Authorization: Bearer $token"             --header "Content-Type: application/json"             --data @complaint-body.json > complaint.json

          node - <<'NODE' "$original_id"
          const d=require('./complaint.json'), originalId=process.argv[2];
          if(!d.order?.id) throw new Error('Complaint order was not created');
          if(d.order.orderType!=='COMPLAINT') throw new Error('Complaint orderType mismatch');
          if(d.order.originalOrderId!==originalId) throw new Error('Complaint originalOrderId mismatch');
          if(d.order.handlingMode!=='COMPLAINT_FLOW') throw new Error('Complaint did not derive COMPLAINT_FLOW');
          if(d.serviceCard?.required!==true) throw new Error('Complaint did not require service card');
          NODE

          complaint_id="$(node -e "const d=require('./complaint.json');process.stdout.write(d.order.id)")"
          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/service/orders/$complaint_id/service-card"             --header "Authorization: Bearer $token"             --header "Content-Type: application/json"             --data '{"printMode":"PHYSICAL_AND_ONLINE"}' > complaint-card.json
          node - <<'NODE'
          const fs=require('fs');
          const d=require('./complaint-card.json');
          const pdf=Buffer.from(d.pdfBase64||'','base64');
          if(pdf.subarray(0,5).toString()!=='%PDF-') throw new Error('Complaint card is not PDF');
          fs.writeFileSync('complaint-card.pdf',pdf);
          NODE
          pdftotext -layout complaint-card.pdf complaint-card.txt
          grep -qi 'Reklamacja' complaint-card.txt || { echo "::error::Complaint label missing from service card"; exit 1; }

      - name: Temp private technician notes E2E
        shell: bash
        run: |
          set -euo pipefail
          tech_token="$(node -e "const d=require('./role-TECHNICIAN.json');process.stdout.write(d.token)")"
          owner_token="$(node -e "const d=require('./role-OWNER.json');process.stdout.write(d.token)")"
          marker="Prywatna notatka CI ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/service/technician-notes"             --header "Authorization: Bearer $tech_token"             --header "Content-Type: application/json"             --data "$(node -e "process.stdout.write(JSON.stringify({title:'TEMP E2E',body:process.argv[1],pinned:true}))" "$marker")" > tech-note.json

          note_id="$(node -e "const d=require('./tech-note.json');if(!d.id)throw new Error('Missing private note id');process.stdout.write(d.id)")"
          curl --silent --show-error --fail-with-body             "$TEMP_API_URL/service/technician-notes"             --header "Authorization: Bearer $tech_token" > tech-notes.json
          node - <<'NODE' "$marker" "$note_id"
          const notes=require('./tech-notes.json'), marker=process.argv[2], id=process.argv[3];
          if(!notes.some(x=>x.id===id&&x.body===marker&&x.pinned===true)) throw new Error('Technician cannot read own private note');
          NODE

          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/service/technician-notes/$note_id"             --header "Authorization: Bearer $tech_token"             --header "Content-Type: application/json"             --data '{"title":"TEMP E2E edited","body":"Edytowana prywatna notatka CI","pinned":false}' > tech-note-edited.json
          node -e "const d=require('./tech-note-edited.json');if(d.title!=='TEMP E2E edited'||d.body!=='Edytowana prywatna notatka CI'||d.pinned!==false)throw new Error('Private note edit failed')"

          owner_code="$(curl --silent --show-error --output owner-private-note.json --write-out '%{http_code}'             "$TEMP_API_URL/service/technician-notes"             --header "Authorization: Bearer $owner_token")"
          [ "$owner_code" = "403" ] || { echo "::error::OWNER unexpectedly read technician private notes: HTTP $owner_code"; cat owner-private-note.json; exit 1; }

          curl --silent --show-error --fail-with-body             --request DELETE "$TEMP_API_URL/service/technician-notes/$note_id"             --header "Authorization: Bearer $tech_token" > tech-note-delete.json
          curl --silent --show-error --fail-with-body             "$TEMP_API_URL/service/technician-notes"             --header "Authorization: Bearer $tech_token" > tech-notes-after.json
          node -e "const d=require('./tech-notes-after.json');if(d.some(x=>x.id===process.argv[1]))throw new Error('Private note was not deleted')" "$note_id"

      - name: Temp draggable technician plan E2E
        shell: bash
        run: |
          set -euo pipefail
          tech_token="$(node -e "const d=require('./role-TECHNICIAN.json');process.stdout.write(d.token)")"
          tech_point="$(node -e "const d=require('./role-TECHNICIAN.json');process.stdout.write(d.activePointId||d.points?.[0]?.id||'')")"
          [ -n "$tech_point" ]

          plan_api() {
            local method="$1" path="$2" body="${3:-}"
            if [ -n "$body" ]; then
              curl --silent --show-error --fail-with-body \
                --request "$method" "$TEMP_API_URL$path" \
                --header "Authorization: Bearer $tech_token" \
                --header "Content-Type: application/json" \
                --data "$body"
            else
              curl --silent --show-error --fail-with-body \
                --request "$method" "$TEMP_API_URL$path" \
                --header "Authorization: Bearer $tech_token"
            fi
          }

          suffix="PLAN-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          make_order() {
            local ordinal="$1"
            node - <<'NODE' "$suffix" "$ordinal"
          const [suffix,ordinal]=process.argv.slice(2);
          process.stdout.write(JSON.stringify({
            firstName:'Plan',
            lastName:'CI '+suffix+' '+ordinal,
            email:'serviceos-plan-'+suffix+'-'+ordinal+'@invalid.test',
            phone:'+48123456789',
            brand:'CI',
            model:'Drag '+ordinal,
            issueDescription:'Test przeciągania i kolejności planu pracy',
            orderType:'REPAIR'
          }));
          NODE
          }

          plan_api POST /service/orders "$(make_order 1)" > plan-order-1.json
          plan_api POST /service/orders "$(make_order 2)" > plan-order-2.json
          order_1="$(node -e "const d=require('./plan-order-1.json');if(!d.order?.id||!d.order?.assignedTechnicianId)throw new Error('Technician intake did not self-assign');process.stdout.write(d.order.id)")"
          order_2="$(node -e "const d=require('./plan-order-2.json');if(!d.order?.id||!d.order?.assignedTechnicianId)throw new Error('Technician intake did not self-assign');process.stdout.write(d.order.id)")"

          target_day="$(node -e "const d=new Date(Date.now()+5*86400000);d.setUTCHours(12,0,0,0);process.stdout.write(d.toISOString())")"
          target_key="$(node -e "process.stdout.write(new Date(process.argv[1]).toISOString().slice(0,10))" "$target_day")"

          plan_api POST "/service/orders/$order_1/plan" "$(node -e "process.stdout.write(JSON.stringify({estimatedCompletionAt:process.argv[1],targetIndex:0}))" "$target_day")" > plan-move-1.json
          node - <<'NODE' "$target_key"
          const d=require('./plan-move-1.json'),target=process.argv[2];
          if(!d.order?.estimatedCompletionAt)throw new Error('Plan move did not return ETA');
          if(new Date(d.order.estimatedCompletionAt).toISOString().slice(0,10)!==target)throw new Error('Plan move returned wrong day');
          if(Number(d.order.planPosition||0)<=0)throw new Error('Plan position was not persisted');
          if(!d.notification||typeof d.notification.sent!=='boolean')throw new Error('ETA notification result missing');
          NODE

          earlier_day="$(node -e "const d=new Date(process.argv[1]);d.setUTCDate(d.getUTCDate()-1);process.stdout.write(d.toISOString())" "$target_day")"
          set +e
          earlier_http="$(curl --silent --show-error --output plan-earlier.json --write-out '%{http_code}'             --request POST "$TEMP_API_URL/service/orders/$order_1/plan"             --header "Authorization: Bearer $tech_token"             --header "Content-Type: application/json"             --data "$(node -e "process.stdout.write(JSON.stringify({estimatedCompletionAt:process.argv[1],targetIndex:0}))" "$earlier_day")")"
          remove_http="$(curl --silent --show-error --output plan-remove.json --write-out '%{http_code}'             --request POST "$TEMP_API_URL/service/orders/$order_1/plan"             --header "Authorization: Bearer $tech_token"             --header "Content-Type: application/json"             --data '{"estimatedCompletionAt":null,"targetIndex":0}')"
          set -e
          [ "$earlier_http" = "409" ] || { echo "::error::Plan allowed moving ETA backward: HTTP $earlier_http"; cat plan-earlier.json; exit 1; }
          [ "$remove_http" = "409" ] || { echo "::error::Plan allowed removing established ETA: HTTP $remove_http"; cat plan-remove.json; exit 1; }
          node -e "const d=require('./plan-earlier.json');if(d.error!=='ETA_CANNOT_MOVE_BACK')throw new Error('Backward plan move returned wrong error')"
          node -e "const d=require('./plan-remove.json');if(d.error!=='ETA_CANNOT_REMOVE')throw new Error('ETA removal returned wrong error')"

          plan_api POST "/service/orders/$order_2/plan" "$(node -e "process.stdout.write(JSON.stringify({estimatedCompletionAt:process.argv[1],targetIndex:0}))" "$target_day")" > plan-move-2.json
          plan_api POST "/service/orders/$order_1/plan" "$(node -e "process.stdout.write(JSON.stringify({estimatedCompletionAt:process.argv[1],targetIndex:0}))" "$target_day")" > plan-reorder.json

          node - <<'NODE'
          const d=require('./plan-reorder.json');
          if(!d.order||Number(d.order.planPosition)!==10)throw new Error('Same-day reorder did not move order to first position');
          if(d.notification?.queued===true)throw new Error('Same-day reorder unexpectedly queued ETA email');
          NODE

          plan_api GET /service/technician-workspace > plan-workspace.json
          node - <<'NODE' "$order_1" "$order_2" "$target_key"
          const w=require('./plan-workspace.json');
          const [oneId,twoId,target]=process.argv.slice(2);
          const one=w.orders?.find(x=>x.id===oneId),two=w.orders?.find(x=>x.id===twoId);
          if(!one||!two)throw new Error('Moved orders missing from technician workspace');
          if(new Date(one.estimatedCompletionAt).toISOString().slice(0,10)!==target||new Date(two.estimatedCompletionAt).toISOString().slice(0,10)!==target)throw new Error('Cross-day drag date was not persisted');
          if(Number(one.planPosition)!==10||Number(two.planPosition)!==20)throw new Error('Daily drag order was not persisted as 1/2');
          NODE

      - name: Temp private invoice signed URL E2E
        shell: bash
        run: |
          set -euo pipefail
          owner_token="$(node -e "const d=require('./role-OWNER.json');process.stdout.write(d.token)")"
          user_token="$(node -e "const d=require('./role-USER.json');process.stdout.write(d.token)")"
          support_token="$(node -e "const d=require('./role-SUPPORT.json');process.stdout.write(d.token)")"
          order_id="$(node -e "const d=require('./intake.json');process.stdout.write(d.order.id)")"
          invoice_point_id="$(node -e "const d=require('./intake.json');process.stdout.write(d.order.pointId)")"

          test -s service-card.pdf
          size_bytes="$(stat -c%s service-card.pdf)"
          sha256="$(sha256sum service-card.pdf | awk '{print $1}')"
          invoice_date="$(date -u +%F)"
          period="${invoice_date:0:7}"
          file_name="CI-Faktura-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.pdf"

          node - <<'NODE' "$file_name" "$size_bytes" "$sha256" "$invoice_date" > invoice-intent-body.json
          const [fileName,sizeBytes,sha256,invoiceDate]=process.argv.slice(2);
          process.stdout.write(JSON.stringify({
            fileName,
            sizeBytes:Number(sizeBytes),
            sha256,
            invoiceNumber:'CI/'+Date.now(),
            supplier:'LockOn CI TEMP',
            invoiceDate,
            grossAmount:123.45
          }));
          NODE

          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/service/orders/$order_id/invoices/upload-intent"             --header "Authorization: Bearer $owner_token"             --header "Content-Type: application/json"             --data @invoice-intent-body.json > invoice-intent.json

          invoice_id="$(node -e "const d=require('./invoice-intent.json');if(!d.invoiceId||!d.uploadUrl)throw new Error('Missing signed upload intent');if(d.expiresInSeconds!==600)throw new Error('Unexpected signed URL TTL');process.stdout.write(d.invoiceId)")"
          upload_url="$(node -e "const d=require('./invoice-intent.json');process.stdout.write(d.uploadUrl)")"
          node -e "const d=require('./invoice-intent.json');if(d.requiredHeaders?.['content-type']!=='application/pdf'||d.requiredHeaders?.['x-amz-meta-sha256']!==process.argv[1])throw new Error('Signed upload headers mismatch')" "$sha256"

          curl --silent --show-error --fail-with-body             --request PUT "$upload_url"             --header "content-type: application/pdf"             --header "x-amz-meta-sha256: $sha256"             --data-binary @service-card.pdf > /dev/null

          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/service/invoices/$invoice_id/complete"             --header "Authorization: Bearer $owner_token"             --header "Content-Type: application/json"             --data '{}' > invoice-complete.json
          owner_id="$(node -e "const d=require('./me.json');process.stdout.write(d.user.id)")"
          node - <<'NODE' "$invoice_id" "$owner_id"
          const d=require('./invoice-complete.json');
          const [invoiceId,ownerId]=process.argv.slice(2);
          if(d.id!==invoiceId||!d.readyAt) throw new Error('Invoice did not become READY');
          if(d.uploadedByUserId!==ownerId || d.uploadedByName!=='System LockOn') throw new Error('OWNER invoice uploader identity leaked');
          NODE

          curl --silent --show-error --fail-with-body             "$TEMP_API_URL/service/invoices?month=$period&pointId=$invoice_point_id"             --header "Authorization: Bearer $owner_token" > invoices-list.json
          node - <<'NODE' "$invoice_id" "$owner_id"
          const d=require('./invoices-list.json');
          const [invoiceId,ownerId]=process.argv.slice(2);
          const invoice=d.invoices?.find(x=>x.id===invoiceId);
          if(!invoice) throw new Error('Ready invoice missing from warehouse');
          if(invoice.uploadedByUserId!==ownerId || invoice.uploadedByName!=='System LockOn') throw new Error('OWNER invoice list identity leaked');
          NODE

          for role_token in "$user_token" "$support_token"; do
            denied="$(curl --silent --show-error --output invoice-denied.json --write-out '%{http_code}'               --request POST "$TEMP_API_URL/service/invoices/$invoice_id/download-intent"               --header "Authorization: Bearer $role_token"               --header "Content-Type: application/json"               --data '{}')"
            [ "$denied" = "403" ] || { echo "::error::Unauthorized role obtained invoice download intent: HTTP $denied"; cat invoice-denied.json; exit 1; }
          done

          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/service/invoices/$invoice_id/download-intent"             --header "Authorization: Bearer $owner_token"             --header "Content-Type: application/json"             --data '{}' > invoice-download.json
          download_url="$(node -e "const d=require('./invoice-download.json');if(!d.downloadUrl||d.expiresInSeconds!==600)throw new Error('Missing signed download URL');const u=new URL(d.downloadUrl);if(![...u.searchParams.keys()].some(k=>k.toLowerCase()==='x-amz-signature'))throw new Error('Download URL is not signed');process.stdout.write(d.downloadUrl)")"

          curl --silent --show-error --fail-with-body "$download_url" --output downloaded-invoice.pdf
          cmp service-card.pdf downloaded-invoice.pdf

          unsigned_url="$(node -e "const u=new URL(process.argv[1]);u.search='';process.stdout.write(u.toString())" "$download_url")"
          unsigned_code="$(curl --silent --show-error --output unsigned-invoice.txt --write-out '%{http_code}' "$unsigned_url")"
          [ "$unsigned_code" != "200" ] || { echo "::error::Private invoice object is publicly readable"; exit 1; }

          tampered_url="$(node -e "const u=new URL(process.argv[1]);const k=[...u.searchParams.keys()].find(x=>x.toLowerCase()==='x-amz-signature');u.searchParams.set(k,'0'.repeat(64));process.stdout.write(u.toString())" "$download_url")"
          tampered_code="$(curl --silent --show-error --output tampered-invoice.txt --write-out '%{http_code}' "$tampered_url")"
          [ "$tampered_code" != "200" ] || { echo "::error::Tampered invoice signature was accepted"; exit 1; }

          curl --silent --show-error --fail-with-body             --request DELETE "$TEMP_API_URL/service/invoices/$invoice_id"             --header "Authorization: Bearer $owner_token" > invoice-delete.json

      - name: Temp hotline privacy and handoff E2E
        shell: bash
        run: |
          set -euo pipefail
          user_token="$(node -e "const d=require('./role-USER.json');process.stdout.write(d.token)")"
          support_token="$(node -e "const d=require('./role-SUPPORT.json');process.stdout.write(d.token)")"
          user_id="$(node -e "const d=require('./role-USER.json');process.stdout.write(d.user.id)")"
          point_id="$(node -e "const d=require('./role-USER.json');process.stdout.write(d.activePointId||d.points?.[0]?.id||'')")"
          [ -n "$point_id" ]

          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/support/leave"             --header "Authorization: Bearer $user_token"             --header "Content-Type: application/json"             --data '{}' > hotline-reset.json

          private_marker="BOT-PRIVATE-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/assistant/chat"             --header "Authorization: Bearer $user_token"             --header "Content-Type: application/json"             --data "$(node -e "process.stdout.write(JSON.stringify({message:process.argv[1],target:'BOT'}))" "$private_marker")" > hotline-bot.json
          node - <<'NODE'
          const d=require('./hotline-bot.json');
          if(!d.assistantMessage?.text) throw new Error('Bot did not answer before consultant request');
          if(d.consultantState!=='BOT') throw new Error('Unexpected consultant state before request');
          NODE

          curl --silent --show-error --fail-with-body             "$TEMP_API_URL/support/tickets"             --header "Authorization: Bearer $support_token" > hotline-tickets-before.json
          node -e "const d=require('./hotline-tickets-before.json');if(d.some(x=>x.userId===process.argv[1]))throw new Error('Bot-only conversation leaked into consultant queue')" "$user_id"

          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/support/request"             --header "Authorization: Bearer $user_token"             --header "Content-Type: application/json"             --data "$(node -e "process.stdout.write(JSON.stringify({pointId:process.argv[1],message:'Proszę konsultanta o dołączenie.'}))" "$point_id")" > hotline-request.json

          curl --silent --show-error --fail-with-body             "$TEMP_API_URL/support/tickets"             --header "Authorization: Bearer $support_token" > hotline-tickets-waiting.json
          node - <<'NODE' "$user_id" "$private_marker"
          const tickets=require('./hotline-tickets-waiting.json'), userId=process.argv[2], secret=process.argv[3];
          const t=tickets.find(x=>x.userId===userId);
          if(!t) throw new Error('Consultant request missing from queue');
          if((t.messages||[]).some(m=>String(m.text||'').includes(secret))) throw new Error('Private bot message leaked to consultant after request');
          NODE

          consultant_marker="CONSULTANT-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/assistant/chat"             --header "Authorization: Bearer $user_token"             --header "Content-Type: application/json"             --data "$(node -e "process.stdout.write(JSON.stringify({message:process.argv[1],target:'CONSULTANT'}))" "$consultant_marker")" > hotline-consultant-msg.json
          node -e "const d=require('./hotline-consultant-msg.json');if(d.assistantMessage!==null||d.userMessage?.target!=='CONSULTANT')throw new Error('Consultant-target message generated bot reply')"

          parallel_bot_marker="BOT-WHILE-WAITING-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/assistant/chat"             --header "Authorization: Bearer $user_token"             --header "Content-Type: application/json"             --data "$(node -e "process.stdout.write(JSON.stringify({message:process.argv[1],target:'BOT'}))" "$parallel_bot_marker")" > hotline-parallel-bot.json
          node -e "const d=require('./hotline-parallel-bot.json');if(!d.assistantMessage?.text||d.consultantState!=='WAITING')throw new Error('Bot stopped helping while consultant was requested')"

          curl --silent --show-error --fail-with-body             "$TEMP_API_URL/support/tickets"             --header "Authorization: Bearer $support_token" > hotline-tickets-after.json
          node - <<'NODE' "$user_id" "$consultant_marker" "$parallel_bot_marker" > hotline-ticket-id.txt
          const tickets=require('./hotline-tickets-after.json');
          const [userId,consultantMarker,botMarker]=process.argv.slice(2);
          const t=tickets.find(x=>x.userId===userId);
          if(!t) throw new Error('Waiting ticket missing');
          if(!(t.messages||[]).some(m=>String(m.text||'').includes(consultantMarker))) throw new Error('Consultant-target message missing from queue');
          if((t.messages||[]).some(m=>String(m.text||'').includes(botMarker))) throw new Error('Parallel private bot message leaked to consultant');
          process.stdout.write(t.id);
          NODE
          ticket_id="$(cat hotline-ticket-id.txt)"

          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/support/tickets/$ticket_id/take"             --header "Authorization: Bearer $support_token"             --header "Content-Type: application/json"             --data '{}' > hotline-take.json

          support_marker="ODPOWIEDZ-KONSULTANTA-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/support/tickets/$ticket_id/reply"             --header "Authorization: Bearer $support_token"             --header "Content-Type: application/json"             --data "$(node -e "process.stdout.write(JSON.stringify({message:process.argv[1]}))" "$support_marker")" > hotline-reply.json

          visible=0
          for attempt in $(seq 1 12); do
            curl --silent --show-error --fail-with-body               "$TEMP_API_URL/support/conversation"               --header "Authorization: Bearer $user_token" > hotline-user-conversation.json
            if node - <<'NODE' "$support_marker" "$private_marker" "$parallel_bot_marker"
          const d=require('./hotline-user-conversation.json');
          const [supportMarker,privateMarker,parallelBot]=process.argv.slice(2);
          if(d.consultantState!=='JOINED') process.exit(1);
          for(const marker of [supportMarker,privateMarker,parallelBot]){
            if(!(d.messages||[]).some(m=>String(m.text||'').includes(marker))) process.exit(1);
          }
          NODE
            then
              visible=1
              break
            fi
            sleep 0.5
          done
          if [[ "$visible" != "1" ]]; then
            echo "::error::Latest consultant reply did not become visible in the user conversation."
            cat hotline-user-conversation.json
            exit 1
          fi

          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/support/leave"             --header "Authorization: Bearer $user_token"             --header "Content-Type: application/json"             --data '{}' > hotline-leave.json
          node -e "const d=require('./hotline-leave.json');if(d.consultantState!=='BOT')throw new Error('Bot did not remain after consultant channel closed')"


      - name: Temp OWNER hotline identity regression
        shell: bash
        run: |
          set -euo pipefail
          owner_token="$(node -e "const d=require('./role-OWNER.json');process.stdout.write(d.token)")"
          owner_id="$(node -e "const d=require('./role-OWNER.json');process.stdout.write(d.user.id)")"
          support_token="$(node -e "const d=require('./role-SUPPORT.json');process.stdout.write(d.token)")"
          boss_token="$(node -e "const d=require('./role-BOSS.json');process.stdout.write(d.token)")"
          boss_id="$(node -e "const d=require('./role-BOSS.json');process.stdout.write(d.user.id)")"
          point_id="$(node -e "const d=require('./role-SUPPORT.json');process.stdout.write(d.activePointId||d.points?.[0]?.id||'')")"
          [ -n "$point_id" ]

          curl --silent --show-error --fail-with-body             "$TEMP_API_URL/support/presence"             --header "Authorization: Bearer $support_token" > owner-presence.json
          node - <<'NODE' "$owner_id"
          const rows=require('./owner-presence.json'), ownerId=process.argv[2];
          const owner=rows.find(x=>x.userId===ownerId);
          if(!owner) throw new Error('OWNER missing from hotline presence regression');
          if(owner.name!=='Właściciel aplikacji' || owner.email!==null || owner.role!=='OWNER') throw new Error('OWNER hotline presence identity is not protected');
          NODE

          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/support/leave"             --header "Authorization: Bearer $boss_token"             --header "Content-Type: application/json"             --data '{}' > owner-hotline-reset.json

          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/support/request"             --header "Authorization: Bearer $boss_token"             --header "Content-Type: application/json"             --data "$(node -e "process.stdout.write(JSON.stringify({pointId:process.argv[1],message:'OWNER privacy regression'}))" "$point_id")" > owner-hotline-request.json

          curl --silent --show-error --fail-with-body             "$TEMP_API_URL/support/tickets"             --header "Authorization: Bearer $support_token" > owner-hotline-tickets-before.json
          node - <<'NODE' "$boss_id" > owner-hotline-ticket-id.txt
          const tickets=require('./owner-hotline-tickets-before.json'), bossId=process.argv[2];
          const ticket=tickets.find(x=>x.userId===bossId);
          if(!ticket) throw new Error('OWNER hotline regression ticket missing');
          process.stdout.write(ticket.id);
          NODE
          ticket_id="$(cat owner-hotline-ticket-id.txt)"

          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/support/tickets/$ticket_id/take"             --header "Authorization: Bearer $owner_token"             --header "Content-Type: application/json"             --data '{}' > owner-hotline-take.json

          curl --silent --show-error --fail-with-body             "$TEMP_API_URL/support/conversation"             --header "Authorization: Bearer $boss_token" > owner-hotline-conversation.json
          node - <<'NODE' "$owner_id"
          const d=require('./owner-hotline-conversation.json'), ownerId=process.argv[2];
          if(d.assignedSupportUserId!==ownerId || d.assignedSupportName!=='Właściciel aplikacji') throw new Error('OWNER consultant label is invalid');
          const joined=(d.messages||[]).find(m=>String(m.text||'').includes('Właściciel aplikacji')&&String(m.text||'').includes('dołączył do rozmowy'));
          if(!joined) throw new Error('OWNER join system message is not anonymized');
          if(JSON.stringify(d).includes('System LockOn')) throw new Error('Operational OWNER alias leaked into Help instead of hotline label');
          NODE

          curl --silent --show-error --fail-with-body             "$TEMP_API_URL/support/tickets"             --header "Authorization: Bearer $support_token" > owner-hotline-tickets-after.json
          node - <<'NODE' "$ticket_id" "$owner_id"
          const tickets=require('./owner-hotline-tickets-after.json');
          const [ticketId,ownerId]=process.argv.slice(2);
          const ticket=tickets.find(x=>x.id===ticketId);
          if(!ticket) throw new Error('OWNER-assigned hotline ticket missing');
          if(ticket.assignedSupportUserId!==ownerId || ticket.assignedSupportName!=='Właściciel aplikacji') throw new Error('OWNER ticket assignment leaked identity');
          NODE

          curl --silent --show-error --fail-with-body             --request POST "$TEMP_API_URL/support/leave"             --header "Authorization: Bearer $boss_token"             --header "Content-Type: application/json"             --data '{}' > owner-hotline-cleanup.json

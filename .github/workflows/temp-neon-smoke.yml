          user_api POST "/service/orders/$user_order_id/transfer" "$(node -e "process.stdout.write(JSON.stringify({kind:'OUTBOUND_SERVICE',toPointId:process.argv[1],note:'USER outbound TEMP E2E'}))" "$destination")" > user-outbound.json
          node - <<'NODE' "$user_point" "$destination"
          const d=require('./user-outbound.json'), from=process.argv[2], to=process.argv[3];
          if(d.transfer?.status!=='IN_TRANSIT'||d.transfer?.fromPointId!==from||d.transfer?.toPointId!==to)throw new Error('USER could not send device to another point');
          NODE
          user_outbound_transfer_id="$(node -e "const d=require('./user-outbound.json');if(!d.transfer?.id)throw new Error('Missing USER outbound transfer id');process.stdout.write(d.transfer.id)")"

          # Destination accepts the phone. The home-point USER must still retain READ access
          # to their customer/order/history, but must not gain technical write access away from home.
          owner_api POST /me/active-point "$(node -e "process.stdout.write(JSON.stringify({pointId:process.argv[1]}))" "$destination")" > owner-user-destination.json
          owner_api POST "/service/transfers/$user_outbound_transfer_id/status" '{"status":"DELIVERED","note":"Telefon dotarł do serwisu"}' > user-outbound-delivered.json
          owner_api POST "/service/transfers/$user_outbound_transfer_id/status" '{"status":"ACCEPTED","note":"Serwis przyjął telefon"}' > user-outbound-accepted.json
          node -e "const d=require('./user-outbound-accepted.json');if(d.transfer?.status!=='ACCEPTED')throw new Error('Destination did not accept USER outbound phone')"

          user_api GET /service/orders > user-orders-away.json
          node - <<'NODE' "$user_order_id" "$destination"
          const rows=require('./user-orders-away.json'), orderId=process.argv[2], destination=process.argv[3];

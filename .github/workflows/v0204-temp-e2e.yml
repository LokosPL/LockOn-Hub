name: v0.20.4 temp Neon E2E

on:
  push:
    branches: ["hotfix/v0.20.4-reliability-security"]
    paths:
      - ".github/workflows/v0204-temp-e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      API_URL: https://br-spring-pond-b1hqe48m-lockonapi.compute.c-5.eu-central-1.aws.neon.tech/
    steps:
      - name: Verify v0.20.4 hotfix contracts against temp Neon
        shell: bash
        run: |
          node <<'NODE'
          const api=process.env.API_URL;
          const owner='v0204-temp-owner-1361837947-62';
          const tech1='v0204-temp-tech1-1361837947-62';
          const tech2='v0204-temp-tech2-1361837947-62';
          const point='pnt_4e66398ed2bffa894cc4';
          const ticket='sup_884afd10e5fbd58187cc';
          const order='srv_c04b091f1cde09c98b97';

          const raw=async(path,token,method='GET',body)=>{
            const response=await fetch(new URL(path.replace(/^\//,''),api),{
              method,
              headers:{
                ...(token?{Authorization:'Bearer '+token}:{}),
                ...(body===undefined?{}:{'Content-Type':'application/json'})
              },
              body:body===undefined?undefined:JSON.stringify(body)
            });
            let payload=null;
            try{payload=await response.json();}catch{}
            return {status:response.status,payload};
          };
          const ok=async(path,token,method='GET',body,status=200)=>{
            const result=await raw(path,token,method,body);
            if(result.status!==status)throw new Error(method+' '+path+' -> '+result.status+' '+JSON.stringify(result.payload));
            return result.payload;
          };

          const health=await ok('/health',null);
          if(health?.ok!==true)throw new Error('health failed');

          const split=await ok('/finance/technician-settings',tech1);
          if(split.configured!==false||split.technicianPercent!==null)throw new Error('null technician split was not preserved');

          for(const path of [
            '/integrations/gmail?pointId='+point,
            '/notifications/settings?pointId='+point,
            '/notifications/history?pointId='+point
          ]){
            const denied=await raw(path,tech1);
            if(denied.status!==403)throw new Error('expected 403 for '+path+', got '+denied.status);
          }

          await ok('/support/tickets/'+ticket+'/take',owner,'POST',{});
          const bot=await ok('/assistant/chat',tech1,'POST',{message:'v0.20.4 bot while consultant joined',target:'BOT'});
          if(!bot?.assistantMessage||bot?.consultantState!=='JOINED')throw new Error('bot did not remain available during JOINED');

          const takeover=await raw('/support/tickets/'+ticket+'/take',tech2,'POST',{});
          if(takeover.status!==409||takeover.payload?.error!=='SUPPORT_ALREADY_ASSIGNED'){
            throw new Error('support takeover was not blocked: '+JSON.stringify(takeover));
          }

          const before=await ok('/service/orders/'+order+'/history',owner);
          const beforeCount=before.filter(item=>item.toStatus==='DIAGNOSIS').length;
          const payload={status:'DIAGNOSIS',actingPointId:point,note:'v0.20.4 concurrency E2E'};
          const concurrent=await Promise.all([
            raw('/service/orders/'+order+'/status',owner,'POST',payload),
            raw('/service/orders/'+order+'/status',owner,'POST',payload)
          ]);
          if(!concurrent.some(item=>item.status===200))throw new Error('no status mutation succeeded');
          for(const result of concurrent){
            if(result.status===409&&result.payload?.error!=='ORDER_STATUS_CHANGED')throw new Error('unexpected 409: '+JSON.stringify(result));
            if(![200,409].includes(result.status))throw new Error('unexpected status mutation response: '+JSON.stringify(result));
          }
          const after=await ok('/service/orders/'+order+'/history',owner);
          const afterCount=after.filter(item=>item.toStatus==='DIAGNOSIS').length;
          if(afterCount!==beforeCount+1)throw new Error('duplicate status history detected: '+beforeCount+' -> '+afterCount);

          await ok('/support/leave',tech1,'POST',{});
          const back=await ok('/support/conversation',tech1);
          if(back.consultantState!=='BOT')throw new Error('support leave did not return to BOT');

          console.log('V0204_TEMP_E2E_OK',{
            nullSplit:true,
            gmailReadForbidden:true,
            supportTakeoverBlocked:true,
            botParallel:true,
            statusConcurrency:true
          });
          NODE
